/* ---------- rich-text PDF paragraph engine (bold labels, centered titles, wrapping) ---------- */
/* estilo atual do texto do contrato (fonte e cor), alterado por writeParagraph para títulos */
const CF = { font:'times', boldColor:[11,31,75], color:[38,44,58] };
function cfColor(pdf, bold){ const c = bold ? CF.boldColor : CF.color; pdf.setTextColor(c[0], c[1], c[2]); }
function measureWordWidth(pdf, word, bold, fontSize){
  pdf.setFont(CF.font, bold?'bold':'normal');
  pdf.setFontSize(fontSize);
  return pdf.getTextWidth(word);
}
function wrapTokensToLines(pdf, tokens, maxWidth, fontSize, firstLineIndent){
  // Fixed estimate for word-wrap decisions only (NOT used for actual rendering/spacing,
  // which is handled natively by the PDF text renderer — see drawLines).
  const spaceWidth = fontSize * 0.28;
  let lines=[], cur=[], curWidth=0, first=true;
  tokens.forEach(({t,bold})=>{
    const ww = measureWordWidth(pdf,t,bold,fontSize);
    const avail = maxWidth - (first?(firstLineIndent||0):0);
    if(curWidth + (cur.length?spaceWidth:0) + ww > avail && cur.length){
      lines.push(cur); first=false; cur=[]; curWidth=0;
    }
    cur.push({t,bold});
    curWidth += (cur.length>1?spaceWidth:0) + ww;
  });
  if(cur.length) lines.push(cur);
  return lines;
}
function ensureSpace(w, needed){
  if(w.y + needed > w.pageHeight - w.marginBottom){ w.pdf.addPage(); w.y = w.marginTop; }
}
/* Groups consecutive same-style tokens into runs and draws each run as ONE string
   (with real space characters embedded). This lets the PDF's own font metrics render
   spacing correctly, instead of relying on manual per-word x-positioning (which was
   producing words with no visible gap between them). */
function drawLines(w, lines, x0, fontSize, align, maxWidth, firstLineIndent){
  const lineHeight = fontSize*1.34;
  lines.forEach((line,li)=>{
    ensureSpace(w, lineHeight);
    let runs=[];
    line.forEach(tok=>{
      if(runs.length && runs[runs.length-1].bold===tok.bold) runs[runs.length-1].words.push(tok.t);
      else runs.push({bold:tok.bold, words:[tok.t]});
    });
    function runString(run, idx){ return run.words.join(' ') + (idx<runs.length-1?' ':''); }
    function runWidth(run, idx){
      w.pdf.setFont(CF.font, run.bold?'bold':'normal'); w.pdf.setFontSize(fontSize);
      return w.pdf.getTextWidth(runString(run, idx));
    }
    let total=0;
    runs.forEach((run,idx)=>{ total += runWidth(run, idx); });

    let x = x0 + (li===0?(firstLineIndent||0):0);
    if(align==='center') x = x0 + (maxWidth-total)/2;

    runs.forEach((run,idx)=>{
      w.pdf.setFont(CF.font, run.bold?'bold':'normal'); w.pdf.setFontSize(fontSize); cfColor(w.pdf, run.bold);
      const s = runString(run, idx);
      w.pdf.text(s, x, w.y);
      x += w.pdf.getTextWidth(s.trimEnd()) + (idx<runs.length-1 ? fontSize*0.42 : 0); // espaço real entre trechos negrito/normal
    });
    w.y += lineHeight;
  });
}
function writeParagraph(w, opts){
  const maxWidth = w.pageWidth-w.marginLeft-w.marginRight;
  // linha de assinatura (texto só com "_"): desenha uma linha de verdade
  if(opts.text && /^_+$/.test(opts.text.trim())){
    ensureSpace(w, 40);
    w.pdf.setDrawColor(11,31,75); w.pdf.setLineWidth(0.8);
    w.pdf.line(w.pageWidth/2-130, w.y, w.pageWidth/2+130, w.y);
    w.y += 14; return;
  }
  // títulos de capítulo (centralizados em negrito): faixa clara com texto azul
  if(opts.align==='center' && opts.bold && (opts.fontSize||10.2) >= 11){
    ensureSpace(w, 44);
    w.y += 4;
    w.pdf.setFillColor(238,242,247); w.pdf.roundedRect(w.marginLeft, w.y-14, maxWidth, 22, 4, 4, 'F');
    w.pdf.setFillColor(255,122,0); w.pdf.circle(w.marginLeft+12, w.y-3, 2.6, 'F');
    w.pdf.setFont('helvetica','bold'); w.pdf.setFontSize(9.6); w.pdf.setTextColor(11,31,75);
    w.pdf.text(opts.text.toUpperCase(), w.pageWidth/2, w.y, {align:'center', charSpace:0.4});
    w.y += 8 + (opts.spacingAfter!=null?opts.spacingAfter:6);
    return;
  }
  // título principal do contrato
  if(opts.bold && !opts.align && (opts.fontSize||0) >= 11.5){
    ensureSpace(w, 50);
    w.pdf.setFont('helvetica','bold'); w.pdf.setFontSize(13); w.pdf.setTextColor(11,31,75);
    const ls = w.pdf.splitTextToSize(opts.text, maxWidth);
    ls.forEach(l=>{ w.pdf.text(l, w.pageWidth/2, w.y, {align:'center'}); w.y += 17; });
    w.y += (opts.spacingAfter!=null?opts.spacingAfter:6) + 2;
    return;
  }
  const fontSize = opts.fontSize||10.2;
  const indent = opts.indent||0;
  let tokens=[];
  if(opts.label) opts.label.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:true}));
  if(opts.text) opts.text.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:!!opts.bold}));
  if(!tokens.length){ w.y += opts.spacingAfter!=null?opts.spacingAfter:6; return; }
  const lines = wrapTokensToLines(w.pdf, tokens, maxWidth, fontSize, indent);
  drawLines(w, lines, w.marginLeft, fontSize, opts.align, maxWidth, indent);
  w.y += opts.spacingAfter!=null?opts.spacingAfter:6;
}
function drawResumoTable(w, rows, title){
  const tableX = w.marginLeft;
  const tableWidth = w.pageWidth - w.marginLeft - w.marginRight;
  const colLeftWidth = tableWidth*0.28, colRightWidth = tableWidth-colLeftWidth;
  const pad = 7, fontSize = 9.4, lineHeight = fontSize*1.34;

  ensureSpace(w, 26);
  w.pdf.setFillColor(11,31,75); w.pdf.roundedRect(tableX, w.y, tableWidth, 24, 4, 4, 'F');
  w.pdf.rect(tableX, w.y+12, tableWidth, 12, 'F');
  w.pdf.setFont('helvetica','bold'); w.pdf.setFontSize(9.6); w.pdf.setTextColor(255,255,255);
  w.pdf.text(title || 'QUADRO RESUMO DA CONTRATAÇÃO', tableX+tableWidth/2, w.y+15.5, {align:'center', charSpace:0.5});
  w.y += 24;
  w.pdf.setDrawColor(213,220,230); w.pdf.setLineWidth(0.6);

  rows.forEach(row=>{
    const labelTokens = row.label.trim().split(/\s+/).map(t=>({t,bold:true}));
    const labelLines = wrapTokensToLines(w.pdf, labelTokens, colLeftWidth-2*pad, fontSize);
    let rightLines=[];
    row.items.forEach((item,idx)=>{
      let tokens=[];
      if(item.label) item.label.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:true}));
      item.text.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:!!item.bold}));
      rightLines = rightLines.concat(wrapTokensToLines(w.pdf, tokens, colRightWidth-2*pad, fontSize, item.indent||0));
      if(idx<row.items.length-1) rightLines.push([]);
    });
    const leftH = labelLines.length*lineHeight + 2*pad + 2;
    const rightH = rightLines.length*lineHeight + 2*pad + 2;
    const rowH = Math.max(leftH, rightH, 30);

    ensureSpace(w, rowH);
    const rowTop = w.y;
    w.pdf.setFillColor(238,242,247); w.pdf.setDrawColor(213,220,230); w.pdf.setLineWidth(0.6);
    w.pdf.rect(tableX, rowTop, colLeftWidth, rowH, 'FD');
    w.pdf.rect(tableX+colLeftWidth, rowTop, colRightWidth, rowH);

    w.y = rowTop + pad + fontSize*0.9;
    drawLines(w, labelLines, tableX+pad, fontSize, 'left', colLeftWidth-2*pad, 0);

    w.y = rowTop + pad + fontSize*0.9;
    rightLines.forEach(line=>{
      if(!line.length){ w.y += lineHeight*0.5; return; }
      drawLines(w, [line], tableX+colLeftWidth+pad, fontSize, 'left', colRightWidth-2*pad, 0);
    });
    w.y = rowTop + rowH;
  });
  w.y += 16;
}

/* o jsPDF subestima a largura da Times-Bold (~3,5%): corrige para o espaçamento ficar certo */
const BOLD_SLACK = 1.035;
function procWidth(pdf, tk, fontSize){
  pdf.setFontSize(fontSize);
  pdf.setFont(CF.font, tk.bold?'bold':'normal'); let x = pdf.getTextWidth(tk.t) * (tk.bold ? BOLD_SLACK : 1);
  if(tk.suffix){ pdf.setFont(CF.font, 'normal'); x += pdf.getTextWidth(tk.suffix); }
  return x;
}
/* quebra de linhas que preserva os tokens (negrito e vírgula colada) e mede com o espaço real mínimo */
function procWrap(pdf, tokens, maxWidth, fontSize){
  const sp = fontSize*0.26, lines = []; let cur = [], wsum = 0;
  tokens.forEach(tk=>{
    const ww = procWidth(pdf, tk, fontSize);
    if(cur.length && wsum + sp + ww > maxWidth){ lines.push(cur); cur = []; wsum = 0; }
    wsum += (cur.length ? sp : 0) + ww; cur.push(tk);
  });
  if(cur.length) lines.push(cur);
  return lines;
}
function drawJustified(w, lines, x0, fontSize, maxWidth){
  const lh = fontSize*1.42;
  lines.forEach((line, li)=>{
    ensureSpace(w, lh);
    // palavras em negrito seguidas viram um só trecho (o espaço entre elas fica o natural da fonte)
    const words = [];
    line.forEach(tk=>{
      const prev = words[words.length-1];
      if(tk.bold && prev && prev.bold && !prev.suffix) { prev.s += ' ' + tk.t; prev.suffix = tk.suffix; }
      else words.push({...tk, s: tk.t});
    });
    const wOf = (txt, bold)=>{ w.pdf.setFont(CF.font, bold?'bold':'normal'); w.pdf.setFontSize(fontSize); return w.pdf.getTextWidth(txt) * (bold ? BOLD_SLACK : 1); };
    const widths = words.map(tk=>wOf(tk.s, tk.bold) + (tk.suffix ? wOf(tk.suffix, false) : 0));
    const total = widths.reduce((a,b)=>a+b, 0), gaps = words.length-1;
    const last = li===lines.length-1;
    const gap = (!last && gaps>0) ? (maxWidth-total)/gaps : fontSize*0.26;
    let x = x0;
    words.forEach((tk,i)=>{
      w.pdf.setFont(CF.font, tk.bold?'bold':'normal'); w.pdf.setFontSize(fontSize); cfColor(w.pdf, tk.bold);
      w.pdf.text(tk.s, x, w.y);
      if(tk.suffix){ const sw = wOf(tk.s, tk.bold); w.pdf.setFont(CF.font, 'normal'); cfColor(w.pdf, false); w.pdf.text(tk.suffix, x + sw, w.y); }
      x += widths[i] + gap;
    });
    w.y += lh;
  });
}

      ...seg('brasileiro, administrador de empresas, portador do RG nº MG-17.777.483, inscrito no CPF/MF 112.737.946-13, endereço comercial na cidade de Araguari, Estado de Minas Gerais, Brasil, a Avenida Nicolau Dorazio 238, Industrial (o “OUTORGADO”), a quem confere, de forma irrevogável, amplos poderes para representá-la, e agindo em causa própria, em qualquer ato, providência ou matéria relacionada às tratativas junto à', false),
      ...seg(conc, true),
      ...seg('para a consulta e solicitação de acesso ao sistema de distribuição de sistemas de microgeração e minigeração distribuídas conforme resolução 482/2012 da ANEEL, podendo o OUTORGADO apresentar projetos de instalação dos equipamentos de micro e minigeração distribuída, apresentar quaisquer documentos, solicitações, requerimentos, cartas, repostas, defesas, esclarecimentos e/ou recursos, incluindo apresentar a “Consulta de Acesso (orçamento estimado)”, “Solicitação de Acesso (orçamento de conexão)”, “Ligação Nova”, podendo ainda, receber e/ou retirar documentos, pareceres, cartas, notificações, respostas e/ou quaisquer outros documentos, requerer vistas, emissão de pareceres, certidões, certificações e/ou quaisquer outros documentos e assinar quaisquer documentos relacionados aos procedimentos acima descritos, em nome da OUTORGANTE, podendo, enfim, realizar todos os atos necessários ao bom e fiel cumprimento deste instrumento, sendo permitido seu substabelecimento no todo ou em parte, com ou sem reserva de poderes. Essa procuração tem prazo de mandato de 06 (seis) meses a contar desta data.', false),
    ];
    // a vírgula logo após o nome fica colada a ele, sem negrito (como no original)
    { const k = tokens.findIndex(tk=>tk.t===','); if(k>0){ tokens[k-1].suffix = ','; tokens.splice(k,1); } }
    const fs = 10.6, maxW = w.pageWidth-w.marginLeft-w.marginRight;
    const lines = procWrap(pdf, tokens, maxW, fs);
    drawJustified(w, lines, w.marginLeft, fs, maxW);
    w.y += 22;

    writeParagraph(w, {text:`${ct.cidade || 'Araguari'}, ${dataFmt}`, fontSize:10.6, spacingAfter:70});

    ensureSpace(w, 50);
    writeParagraph(w, {text:'_'.repeat(55), align:'center', spacingAfter:4});
    writeParagraph(w, {text:`Nome: ${d.clienteNome}`, align:'center', bold:true, fontSize:10.6, spacingAfter:4});

    ssHeaderFooter(pdf, w, `PROCURAÇÃO — ${conc.toUpperCase()}`, `Outorgante: ${d.clienteNome||''}`);
    pdf.save(`Procuracao_${conc.replace(/[^a-zA-Z0-9]+/g,'_')}_${(d.clienteNome||'cliente').replace(/[^a-zA-Z0-9]+/g,'_')}.pdf`);
    toast('Procuração gerada com sucesso.');
    return true;
  }catch(err){
    console.error('Erro ao gerar procuração:', err);
    toast('Erro ao gerar a procuração: '+(err&&err.message?err.message:err));
    return false;
  }
}


/* =========================================================================
   DOCUMENTOS DO CLIENTE → GOOGLE DRIVE (Apps Script)
   ========================================================================= */
const DRIVE_SCRIPT = "/**\n * SUPERSUNN \u2014 Documentos dos clientes no Google Drive\n * Cole este c\u00f3digo em https://script.google.com (Novo projeto), troque a CHAVE abaixo pela chave\n * mostrada no gerador (Configura\u00e7\u00f5es > Google Drive) e publique como \"App da Web\":\n *   Executar como: Eu  \u00b7  Quem pode acessar: Qualquer pessoa\n * Depois copie a URL do app da Web (termina em /exec) e cole no gerador.\n */\nconst CHAVE = 'COLE_A_CHAVE_DO_GERADOR_AQUI';\nconst PASTA_PRINCIPAL = 'SUPERSUNN - Clientes';\n\nfunction doPost(e) {\n  try {\n    const req = JSON.parse(e.postData.contents);\n    if (!req.key || req.key !== CHAVE) return out({ ok: false, error: 'Chave inv\u00e1lida. Confira a chave no script e no gerador.' });\n    if (req.action === 'ping') { const p = pastaPrincipal(); return out({ ok: true, parentUrl: p.getUrl() }); }\n    if (req.action === 'upload') {\n      const pasta = pastaDoCliente(req.client || {});\n      const blob = Utilities.newBlob(Utilities.base64Decode(req.data), req.mimeType || 'application/octet-stream', req.fileName || 'arquivo');\n      const file = pasta.createFile(blob);\n      return out({ ok: true, fileId: file.getId(), fileUrl: file.getUrl(), folderId: pasta.getId(), folderUrl: pasta.getUrl() });\n    }\n    if (req.action === 'trash') { DriveApp.getFileById(req.fileId).setTrashed(true); return out({ ok: true }); }\n    return out({ ok: false, error: 'A\u00e7\u00e3o desconhecida' });\n  } catch (err) {\n    return out({ ok: false, error: String(err && err.message || err) });\n  }\n}\nfunction doGet() { return out({ ok: true, info: 'SUPERSUNN Drive ativo' }); }\n\nfunction pastaPrincipal() {\n  const props = PropertiesService.getScriptProperties();\n  const id = props.getProperty('PARENT_ID');\n  if (id) { try { const f = DriveApp.getFolderById(id); if (!f.isTrashed()) return f; } catch (e) {} }\n  const it = DriveApp.getFoldersByName(PASTA_PRINCIPAL);\n  const f = it.hasNext() ? it.next() : DriveApp.createFolder(PASTA_PRINCIPAL);\n  props.setProperty('PARENT_ID', f.getId());\n  return f;\n}\nfunction pastaDoCliente(c) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const props = PropertiesService.getScriptProperties(), k = 'C_' + (c.id || c.nome);\n    const id = props.getProperty(k);\n    if (id) { try { const f = DriveApp.getFolderById(id); if (!f.isTrashed()) return f; } catch (e) {} }\n    const nome = [c.nome || 'Cliente', c.cpf || ''].filter(String).join(' - ').replace(/[\\/\\\\]/g, '-');\n    const f = pastaPrincipal().createFolder(nome);\n    props.setProperty(k, f.getId());\n    return f;\n  } finally { lock.releaseLock(); }\n}\nfunction out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n";
const DOC_TIPOS = ['RG / CNH', 'CPF', 'Conta de luz', 'Comprovante de endereço', 'Procuração assinada', 'Contrato assinado', 'Fotos do local', 'Outros'];
function driveCfg(){ const p = STATE.proposalSettings || {}; return { url:(p.driveUrl||'').trim(), key:(p.driveKey||'').trim() }; }
function novaChaveDrive(){ const a = new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a, b=>b.toString(16).padStart(2,'0')).join(''); }

function viewDriveConfig(){
  const c = driveCfg();
  const key = c.key || (STATE.__driveKeyDraft = STATE.__driveKeyDraft || novaChaveDrive());
  return `
    <div class="sub">Os documentos anexados no card do cliente vão para a pasta <b>SUPERSUNN - Clientes / Nome - CPF</b> no seu Google Drive.</div>
    <div class="help"><b>Como ligar (uma vez só):</b><br>
      1. Abra <a href="https://script.google.com" target="_blank" rel="noopener">script.google.com</a> com a conta do Google onde as pastas devem ficar → <b>Novo projeto</b>.<br>
      2. Apague o que estiver lá e cole o script (botão abaixo). Ele já vai com a sua chave.<br>
      3. Clique em <b>Implantar → Nova implantação → App da Web</b>. Executar como: <b>Eu</b>. Quem pode acessar: <b>Qualquer pessoa</b>. Autorize o acesso ao Drive.<br>
      4. Copie a <b>URL do app da Web</b> (termina em <code>/exec</code>), cole aqui e clique em <b>Salvar e testar</b>.</div>
    <form id="drive-form">
      <div class="row">
        <div class="field" style="flex:3"><label>URL do app da Web (Apps Script)</label><input name="driveUrl" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/.../exec"></div>
        <div class="field" style="flex:2"><label>Chave</label><input name="driveKey" value="${esc(key)}" readonly style="font-family:monospace;font-size:12px"></div>
      </div>
      <button type="button" class="btn btn-outline" onclick="copiarScriptDrive()">Copiar script (com a chave)</button>
      <button type="submit" class="btn btn-primary">Salvar e testar</button>
    </form>
    <div id="drive-result" style="margin-top:8px;font-size:13px"></div>`;
}
window.copiarScriptDrive = async ()=>{
  const key = (document.querySelector('#drive-form [name=driveKey]')||{}).value || driveCfg().key;
  const code = DRIVE_SCRIPT.replace("COLE_A_CHAVE_DO_GERADOR_AQUI", key);
  try{ await navigator.clipboard.writeText(code); toast('Script copiado. Cole no Apps Script.'); }
  catch(e){ const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('Script copiado.'); }
};
async function driveCall(payload){
  const c = driveCfg();
  if(!c.url || !c.key) throw new Error('Configure o Google Drive em Configurações.');
  const r = await fetch(c.url, { method:'POST', body: JSON.stringify({ ...payload, key:c.key }) });   // text/plain: sem preflight de CORS
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Resposta inválida do Apps Script. Confira se a URL termina em /exec e se o acesso é "Qualquer pessoa".'); }
  if(!j.ok) throw new Error(j.error || 'Falha no Apps Script');
  return j;
}
document.addEventListener('submit', async (e)=>{
  if(e.target.id !== 'drive-form') return;
  e.preventDefault();
  const fd = new FormData(e.target), out = document.getElementById('drive-result');
  STATE.proposalSettings = { ...(STATE.proposalSettings||{}), driveUrl: (fd.get('driveUrl')||'').trim(), driveKey: (fd.get('driveKey')||'').trim() };
  await saveKey('proposalSettings', STATE.proposalSettings);
  out.textContent = 'Testando...';
  try{ const j = await driveCall({ action:'ping' }); out.innerHTML = `✅ Conectado. Pasta principal: <a href="${j.parentUrl}" target="_blank" rel="noopener">abrir no Drive</a>`; }
  catch(err){ out.textContent = '❌ ' + err.message; }
});

function docsBoxHtml(c){
  if(!c) return '';
  const docs = (c.docs||[]).slice().sort((a,b)=>a.tipo.localeCompare(b.tipo) || new Date(a.at)-new Date(b.at));
  const ok = !!driveCfg().url;
  return `
    <b style="font-size:13px;color:var(--navy-dark);display:block;margin-top:14px">Documentos (${docs.length})
      ${c.driveFolderUrl ? `<a class="link-btn" style="margin-left:8px" href="${esc(c.driveFolderUrl)}" target="_blank" rel="noopener">Abrir pasta no Drive</a>` : ''}</b>
    ${ok ? `
    <div class="docs-drop" id="docs-drop" data-client="${c.id}"
         ondragover="event.preventDefault(); this.classList.add('over')" ondragleave="this.classList.remove('over')"
         ondrop="event.preventDefault(); this.classList.remove('over'); anexarDocs('${c.id}', event.dataTransfer.files)">
      <select id="docs-tipo" onchange="window.__docTipo=this.value">${DOC_TIPOS.map(t=>`<option ${t===(window.__docTipo||DOC_TIPOS[0])?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <label class="btn btn-outline btn-sm" style="cursor:pointer;margin:0">Escolher arquivos
        <input type="file" multiple accept="image/*,application/pdf" style="display:none" onchange="anexarDocs('${c.id}', this.files); this.value=''">
      </label>
      <span class="docs-hint">ou arraste aqui (fotos e PDF)</span>
    </div>
    <div id="docs-progress" class="docs-hint" style="margin:4px 0"></div>` : `<div class="empty-sm">Para anexar documentos, ligue o Google Drive em Configurações → Google Drive.</div>`}
    ${docs.length ? `<ul class="item-list">${docs.map(d=>`
      <li>
        <span><b>${esc(d.tipo)}</b> — <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.nome)}</a> <span class="docs-hint">${new Date(d.at).toLocaleDateString('pt-BR')}</span></span>
        <span style="white-space:nowrap"><button class="link-btn" onclick="removerDoc('${c.id}','${d.id}')">Remover</button></span>
      </li>`).join('')}</ul>` : (ok ? `<div class="empty-sm">Nenhum documento anexado ainda.</div>` : '')}`;
}

/* fotos grandes viram JPEG de até 2200 px (o Apps Script aceita envios de tamanho limitado) */
async function prepararArquivo(file){
  if(!/^image\//.test(file.type) || file.size < 1.5e6 || file.type==='image/gif') return file;
  try{
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*s); cv.height = Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r=>cv.toBlob(r, 'image/jpeg', .85));
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' });
  }catch(e){ return file; }
}
const toB64 = f=>new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
const semAcento = s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\- ]+/g,'').trim();

window.anexarDocs = async (clientId, fileList)=>{
  const files = Array.from(fileList||[]); if(!files.length) return;
  const c = STATE.clients.find(x=>x.id===clientId); if(!c) return;
  const tipo = (document.getElementById('docs-tipo')||{}).value || 'Outros';
  const prog = ()=>document.getElementById('docs-progress');
  const hoje = new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
  let feitos = 0;
  for(const [i, f0] of files.entries()){
    if(prog()) prog().textContent = `Enviando ${i+1} de ${files.length}: ${f0.name}...`;
    try{
      const f = await prepararArquivo(f0);
      if(f.size > 30e6){ toast(`${f0.name}: arquivo maior que 30 MB, não enviado.`); continue; }
      const ext = (f.name.match(/\.[^.]+$/)||[''])[0].toLowerCase();
      const n = (c.docs||[]).filter(d=>d.tipo===tipo).length + 1;
      const nome = `${semAcento(tipo).replace(/ +/g,'_')}${n>1?'_'+n:''} - ${semAcento(c.nome)} - ${hoje}${ext}`;
      const j = await driveCall({ action:'upload', client:{ id:c.id, nome:c.nome, cpf:c.cpf||'' }, fileName:nome, mimeType:f.type||'application/octet-stream', data: await toB64(f) });
      c.docs = c.docs || [];
      c.docs.push({ id: uid(), tipo, nome, fileId:j.fileId, url:j.fileUrl, size:f.size, at:new Date().toISOString() });
      c.driveFolderUrl = j.folderUrl; c.driveFolderId = j.folderId;
      await saveKey('clients', STATE.clients);
      feitos++;
    }catch(err){ console.error(err); toast(`Erro ao enviar ${f0.name}: ${err.message}`); }
  }
  if(feitos) toast(feitos===1 ? 'Documento salvo no Drive.' : `${feitos} documentos salvos no Drive.`);
  renderMain();
};
window.removerDoc = async (clientId, docId)=>{
  const c = STATE.clients.find(x=>x.id===clientId); if(!c) return;
  const d = (c.docs||[]).find(x=>x.id===docId); if(!d) return;
  if(!confirm(`Remover "${d.nome}"? O arquivo vai para a lixeira do Drive.`)) return;
  try{ if(d.fileId) await driveCall({ action:'trash', fileId:d.fileId }); }
  catch(err){ if(!confirm('Não foi possível mover para a lixeira do Drive (' + err.message + '). Remover só da lista?')) return; }
  c.docs = c.docs.filter(x=>x.id!==docId);
  await saveKey('clients', STATE.clients);
  toast('Documento removido.'); renderMain();
};
