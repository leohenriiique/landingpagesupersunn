/* ---------- métricas do painel ---------- */
const MES_ABR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MES_NOME = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
/* lista de ganho do funil: nome com "fechad" que não seja de perda */
function stageFechadoIds(){ return STATE.funnelStages.filter(st=>/fechad|ganh/i.test(st.nome) && !/perd/i.test(st.nome)).map(st=>st.id); }
function dataFechamento(c){ return c.fechadoEm || c.updatedAt || c.createdAt; }
function propostaValor(p){ return Number(p.pagamento&&p.pagamento.vista) || Number(p.investimento) || Number(p.valor) || 0; }

/* ---------- filtro de período do painel ---------- */
const DASH_PERIODOS = [
  {k:'mes', t:'Este mês'}, {k:'mes_passado', t:'Mês passado'}, {k:'3m', t:'3 meses'},
  {k:'6m', t:'6 meses'}, {k:'ano', t:'Este ano'}, {k:'custom', t:'Personalizado'},
];
let DASH_PERIOD = {k:'mes'};
try{ const sv = JSON.parse(localStorage.getItem('dashPeriod')||'null'); if(sv && sv.k) DASH_PERIOD = sv; }catch(e){}
function diasNoMes(y,m){ return new Date(y, m+1, 0).getDate(); }
function fimDia(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999); }
function parseDia(s){ const [y,m,d] = String(s||'').split('-').map(Number); return (y&&m&&d) ? new Date(y, m-1, d) : null; }
function isoDia(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDiaCurto(d){ return d.getDate()+' '+MES_ABR[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
function dashPeriodo(){
  const h = new Date(), y = h.getFullYear(), m = h.getMonth(), dia = h.getDate();
  const ateHoje = (n)=>{   // n meses até hoje, comparado com os n meses anteriores até o mesmo dia
    const pm = new Date(y, m-n, 1);
    return { ini:new Date(y, m-(n-1), 1), fim:fimDia(h), pIni:new Date(y, m-(2*n-1), 1),
             pFim:fimDia(new Date(pm.getFullYear(), pm.getMonth(), Math.min(dia, diasNoMes(pm.getFullYear(), pm.getMonth())))) };
  };
  const k = DASH_PERIOD.k;
  let r;
  if(k==='mes_passado') r = { ini:new Date(y,m-1,1), fim:fimDia(new Date(y,m,0)), pIni:new Date(y,m-2,1), pFim:fimDia(new Date(y,m-1,0)),
                              titulo:'de '+MES_NOME[(m+11)%12] };
  else if(k==='3m') r = {...ateHoje(3), titulo:'dos últimos 3 meses'};
  else if(k==='6m') r = {...ateHoje(6), titulo:'dos últimos 6 meses'};
  else if(k==='ano') r = { ini:new Date(y,0,1), fim:fimDia(h), pIni:new Date(y-1,0,1),
                           pFim:fimDia(new Date(y-1, m, Math.min(dia, diasNoMes(y-1, m)))), titulo:'de '+y };
  else if(k==='custom'){
    let a = parseDia(DASH_PERIOD.de) || new Date(y,m,1), b = parseDia(DASH_PERIOD.ate) || h;
    if(b < a) [a,b] = [b,a];
    const dias = Math.round((b - a)/864e5) + 1;
    const pFim = new Date(a.getFullYear(), a.getMonth(), a.getDate()-1);
    let pIni = new Date(pFim.getFullYear(), pFim.getMonth(), pFim.getDate()-(dias-1));
    // período de meses inteiros (ex.: 1/set a 30/set) compara com os meses inteiros anteriores
    if(a.getDate()===1 && b.getDate()===diasNoMes(b.getFullYear(), b.getMonth())){
      const nm = (b.getFullYear()-a.getFullYear())*12 + b.getMonth()-a.getMonth() + 1;
      pIni = new Date(a.getFullYear(), a.getMonth()-nm, 1);
    }
    r = { ini:a, fim:fimDia(b), pIni, pFim:fimDia(pFim),
          titulo:'de '+fmtDiaCurto(a)+' a '+fmtDiaCurto(b) };
  }
  else { r = {...ateHoje(1), titulo:'de '+MES_NOME[m]}; r.mesAntInteiro = {ini:new Date(y,m-1,1), fim:fimDia(new Date(y,m,0)), nome:MES_ABR[(m+11)%12]}; }
  return r;
}
function noPeriodo(dt, a, b){ if(!dt) return false; const d = new Date(dt); return !isNaN(d) && d >= a && d <= b; }
function dashFonte(kind){
  if(kind==='receitas'){ const f = stageFechadoIds();
    return { src:STATE.funnelCards.filter(c=>f.includes(c.stageId)), dt:dataFechamento, val:c=>Number(getClientDealValue(c.clientId))||0 }; }
  return { src: kind==='leads' ? STATE.clients : STATE.proposals, dt:x=>x.createdAt, val:()=>1 };
}
function dashMetric(kind){
  const P = dashPeriodo(), F = dashFonte(kind);
  const doIntervalo = (a,b)=>F.src.filter(x=>noPeriodo(F.dt(x), a, b));
  const soma = (a,b)=>doIntervalo(a,b).reduce((t,x)=>t+F.val(x),0);
  const itens = doIntervalo(P.ini, P.fim);
  const r = { kind, P, atual:soma(P.ini,P.fim), anterior:soma(P.pIni,P.pFim), qtd:itens.length };
  if(P.mesAntInteiro) r.mesAntInteiro = soma(P.mesAntInteiro.ini, P.mesAntInteiro.fim);
  if(kind==='leads'){ r.site = itens.filter(c=>c.origem==='landing-supersunn').length; r.manual = itens.length - r.site; }
  if(kind==='propostas') r.valor = itens.reduce((t,p)=>t+propostaValor(p),0);
  if(kind==='receitas') r.lista = (STATE.funnelStages.find(st=>st.id===stageFechadoIds()[0])||{}).nome || 'Fechado';
  // gráfico: barras mensais terminando no mês do fim do período
  const fimM = new Date(P.fim.getFullYear(), P.fim.getMonth(), 1);
  const spanMeses = (P.fim.getFullYear()-P.ini.getFullYear())*12 + P.fim.getMonth()-P.ini.getMonth() + 1;
  const n = Math.max(6, Math.min(12, spanMeses*2));
  r.barras = [];
  for(let i=n-1;i>=0;i--){
    const a = new Date(fimM.getFullYear(), fimM.getMonth()-i, 1), b = fimDia(new Date(a.getFullYear(), a.getMonth()+1, 0));
    const tipo = (b >= P.ini && a <= P.fim) ? 'atual' : ((b >= P.pIni && a <= P.pFim) ? 'anterior' : 'outro');
    r.barras.push({ label:MES_ABR[a.getMonth()]+(n>6 && a.getMonth()===0 ? ' '+String(a.getFullYear()).slice(2) : ''), v:soma(a,b), tipo });
  }
  return r;
}
function dashDelta(atual, base){
  if(!base && !atual) return `<span class="dm-delta flat">— igual</span>`;
  if(!base) return `<span class="dm-delta up">▲ novo</span>`;
  const p = (atual-base)/base*100;
  if(Math.abs(p)<0.5) return `<span class="dm-delta flat">= igual</span>`;
  return `<span class="dm-delta ${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p).toLocaleString('pt-BR',{maximumFractionDigits:0})}%</span>`;
}

function hojeIso(){ return isoDia(new Date()); }
function diasEntre(isoA, isoB){ return Math.round((parseDia(isoB) - parseDia(isoA))/864e5); }
function fmtDataBr(iso){ const d = parseDia(iso); return d ? d.toLocaleDateString('pt-BR') : ''; }
function waLink(tel){
  let d = String(tel||'').replace(/\D/g,''); if(!d) return '';
  if(d.length<=11) d = '55'+d;
  return 'https://wa.me/'+d;
}
/* última movimentação do cliente: cadastro/edição, card movido, contato registrado, proposta ou follow-up concluído */
function ultimaMovimentacao(cli, card){
  const ds = [cli.createdAt, cli.updatedAt, cli.followUpFeitoEm, card&&card.createdAt, card&&card.updatedAt, card&&card.fechadoEm];
  (cli.interacoes||[]).forEach(t=>ds.push(t.date));
  STATE.proposals.forEach(p=>{ if(p.clientId===cli.id) ds.push(p.createdAt); });
  STATE.contracts.forEach(c=>{ if(c.clientId===cli.id) ds.push(c.createdAt); });
  let max = 0; ds.forEach(x=>{ const t = x ? new Date(x).getTime() : 0; if(t && !isNaN(t) && t>max) max = t; });
  return max || null;
}
function stagesEncerrados(){ return STATE.funnelStages.filter(st=>/fechad|ganh|perd/i.test(st.nome)).map(st=>st.id); }
function calcLembretes(){
  const hoje = hojeIso(), enc = stagesEncerrados(), agora = Date.now();
  const follow = [], parados = [];
  STATE.clients.forEach(cli=>{
    const card = STATE.funnelCards.find(c=>c.clientId===cli.id);
    const st = card ? STATE.funnelStages.find(s=>s.id===card.stageId) : null;
    const base = { cli, card, etapa: st ? st.nome : '' };
    if(cli.followUp && cli.followUp.data && cli.followUp.data <= hoje){
      follow.push({ ...base, atraso: diasEntre(cli.followUp.data, hoje) });
    }
    if(!st || !/^\s*(novo\s*lead|contato\s*realizado|propostas?\s*enviadas?|negocia)/i.test(st.nome)) return;  // só etapas em andamento
    if(cli.followUp && cli.followUp.data) return;  // já tem contato agendado (hoje/atrasado aparece na outra lista)
    const ult = ultimaMovimentacao(cli, card);
    if(ult && agora - ult > 2*864e5) parados.push({ ...base, dias: Math.floor((agora-ult)/864e5) });
  });
  follow.sort((a,b)=>b.atraso-a.atraso);
  parados.sort((a,b)=>b.dias-a.dias);
  return { follow, parados };
}

   CONTROLE DE CLIENTES (pós-venda)
   ========================================================================= */
const OBRA_PRAZO_PADRAO = 50, PARECER_VALIDADE = 120, VISTORIA_PRAZO = 7;
const EQUIP_STATUS = ['Comprar','Pedido','Trânsito','Estoque','Entregue','Instalado'];
const HOMOL_STATUS = ['Aguardando documentação','Enviado','Em análise','Aprovado','Não se aplica'];
let obraEditId = null, OBRA_FILTRO = 'andamento', OBRA_BUSCA = '';
function addDias(iso, n){ const d = parseDia(iso); if(!d) return ''; d.setDate(d.getDate()+Number(n||0)); return isoDia(d); }
function dataCurta(iso){ const d = parseDia(iso); return d ? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+(d.getFullYear()!==new Date().getFullYear()?'/'+String(d.getFullYear()).slice(2):'') : ''; }
function diaDe(dt){ if(!dt) return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(dt)) return dt; const d = new Date(dt); return isNaN(d) ? '' : isoDia(d); }

function kitDoContrato(ct){
  const sn = (ct && ct.snapshot) || {};
  return { placasQtd: Number(sn.modulosQtd)||0, placasModelo: sn.modulosModelo||'',
           inversorQtd: Number(sn.inversoresQtd)||0, inversorModelo: sn.inversoresModeloTexto||'',
           inversorKw: Number(sn.inversoresPotenciaKw)||0, inversorTipo: sn.inversoresTipo||'' };
}
/* cria automaticamente um registro para cada contrato gerado e para cada card em "Fechado (Ganho)" */
function syncObras(){
  STATE.obras = STATE.obras || [];
  let mudou = false;
  const fech = stageFechadoIds();
  const dataCt = ct=>diaDe(ct.dataContrato) || diaDe(ct.createdAt);
  const fechados = new Set();
  // só entra no controle quem está na lista "Fechado (Ganho)" do funil — uma linha por cliente
  STATE.funnelCards.filter(c=>fech.includes(c.stageId) && c.clientId).forEach(c=>{
    fechados.add(c.clientId);
    const cts = STATE.contracts.filter(k=>k.clientId===c.clientId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    const ct = cts[0];   // contrato mais recente = a proposta que virou contrato
    let doCliente = STATE.obras.filter(x=>x.clientId===c.clientId);
    let o = (ct && doCliente.find(x=>x.contractId===ct.id)) || doCliente[0];
    if(doCliente.length > 1){
      // registros duplicados (ex.: contrato refeito para outra proposta): junta tudo num só
      doCliente.filter(x=>x!==o).forEach(x=>{
        ['equip','homol','parecerEmissao','vistoriaSolicitada','vistoriaRealizada','execInicio','execFim','obs'].forEach(k=>{
          const padrao = (k==='equip' && x[k]==='Comprar') || (k==='homol' && x[k]==='Aguardando documentação');
          if(x[k] && !padrao && (!o[k] || o[k]==='Comprar' || o[k]==='Aguardando documentação')) o[k] = x[k];
        });
      });
      STATE.obras = STATE.obras.filter(x=>x.clientId!==c.clientId || x===o);
      mudou = true;
    }
    if(!o){
      o = { id:uid(), clientId:c.clientId, contractId:'', inicio:'', prazoDias:OBRA_PRAZO_PADRAO, execInicio:'', execFim:'',
        equip:'Comprar', homol:'Aguardando documentação', parecerEmissao:'', vistoriaSolicitada:'', vistoriaRealizada:'', obs:'', createdAt:new Date().toISOString() };
      STATE.obras.push(o); mudou = true;
    }
    if(ct && o.contractId !== ct.id){
      const antigo = STATE.contracts.find(k=>k.id===o.contractId);
      if(!o.inicio || (antigo && o.inicio===dataCt(antigo))) o.inicio = dataCt(ct);
      o.contractId = ct.id;
      o.prazoDias = Number(ct.snapshot && ct.snapshot.prazoConclusaoDias) || o.prazoDias || OBRA_PRAZO_PADRAO;
      Object.assign(o, kitDoContrato(ct)); mudou = true;
    }
    if(o.contractId && o.placasQtd===undefined){ const k = STATE.contracts.find(x=>x.id===o.contractId); if(k){ Object.assign(o, kitDoContrato(k)); mudou = true; } }
  });
  // quem saiu de "Fechado (Ganho)" perde a marca de retirado: se voltar, entra de novo
  STATE.obras.forEach(o=>{
    if(o.oculto && !fechados.has(o.clientId)){ delete o.oculto; mudou = true; }
    if(o.finOculto && !fechados.has(o.clientId)){ delete o.finOculto; mudou = true; }
  });
  if(mudou) saveKey('obras', STATE.obras);
}
/* registros do cliente cujo card está em "Fechado (Ganho)" (os dados de quem sai ficam guardados) */
function obrasDoFunil(){
  const fech = stageFechadoIds();
  const ids = new Set(STATE.funnelCards.filter(c=>fech.includes(c.stageId)).map(c=>c.clientId));
  return (STATE.obras||[]).filter(o=>ids.has(o.clientId));
}
function obrasVisiveis(){ return obrasDoFunil().filter(o=>!o.oculto); }
function obraInfo(o){
  const hoje = hojeIso();
  const cli = STATE.clients.find(c=>c.id===o.clientId);
  const ct = STATE.contracts.find(c=>c.id===o.contractId);
  const prop = ct ? STATE.proposals.find(p=>p.id===ct.proposalId) : null;   // só a proposta que virou contrato
  const nome = (cli && cli.nome) || (ct && ct.clienteNome) || o.clienteNome || 'Cliente';
  const kwp = Number((ct && ct.potenciaKwp) || (prop && prop.kwp) || 0);
  const valor = Number((ct && ct.valorTotal) || (prop && propostaValor(prop)) || 0);
  const na = o.homol==='Não se aplica';   // sem homologação: parecer e vistoria também não se aplicam
  const concl = na ? !!o.execFim : !!o.vistoriaRealizada;
  const fimReal = na ? o.execFim : o.vistoriaRealizada;
  const prazo = Number(o.prazoDias) || OBRA_PRAZO_PADRAO;
  const fim = o.inicio ? addDias(o.inicio, prazo) : '';
  const restam = fim ? diasEntre(hoje, fim) : null;
  const decorridos = o.inicio ? Math.max(0, diasEntre(o.inicio, concl ? fimReal : hoje)) : 0;
  const pValid = !na && o.parecerEmissao ? addDias(o.parecerEmissao, PARECER_VALIDADE) : '';
  const pRestam = pValid ? diasEntre(hoje, pValid) : null;
  const vPrazo = !na && o.vistoriaSolicitada ? addDias(o.vistoriaSolicitada, VISTORIA_PRAZO) : '';
  const vRestam = vPrazo ? diasEntre(hoje, vPrazo) : null;
  const f = {
    atrasada: !concl && restam!==null && restam<0,
    curto: !concl && restam!==null && restam>=0 && restam<=10,
    parecer: !concl && pRestam!==null && pRestam<=15,
    vistAtrasada: !concl && vRestam!==null && vRestam<0,
    vistPendente: !concl && !na && !!o.vistoriaSolicitada,
    semInicio: !o.inicio,
  };
  const urg = concl ? 9999 : Math.min(restam===null?500:restam, pRestam===null?500:pRestam+5, vRestam===null?500:vRestam);
  return { na, o, cli, ct, nome, kwp, valor, concl, prazo, fim, restam, decorridos, pValid, pRestam, vPrazo, vRestam, f, urg,
           alerta: f.atrasada || f.curto || f.parecer || f.vistAtrasada };
}

/* =========================================================================
   CONTROLE FINANCEIRO

const FIN_CUSTOS = [
  {k:'equip', t:'Valor de equipamento'}, {k:'ca', t:'C.A.'}, {k:'mo', t:'Mão de obra'}, {k:'comissao', t:'Comissão'},
  {k:'homolArt', t:'Homologação + ART'}, {k:'extras', t:'Custos extras'}, {k:'taxas', t:'Taxas e descontos'},
];
let finEditId = null, FIN_PERIODO = 'todos', FIN_BUSCA = '';
function parseBRL(v){
  if(typeof v==='number') return v;
  let s = String(v||'').replace(/[^\d,.-]/g,'');
  if(!s) return 0;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}
function brl(n){ return 'R$ '+fmtMoney(n); }
function brl0(n){ return 'R$ '+Math.round(Number(n)||0).toLocaleString('pt-BR'); }
function finInfo(o){
  const x = obraInfo(o), f = o.fin || {};
  const valorContrato = x.ct ? Number(x.ct.valorTotal || (x.ct.snapshot && x.ct.snapshot.valorTotal) || 0) : 0;
  const valor = (f.valorManual!=null && f.valorManual!=='') ? Number(f.valorManual) : valorContrato;
  const custos = FIN_CUSTOS.reduce((t,c)=>t+(Number(f[c.k])||0),0);
  const saldo = (f.saldo==null || f.saldo==='') ? valor : Number(f.saldo);
  const margem = valor - custos;
  const pct = valor ? margem/valor*100 : 0;
  const data = x.ct ? (diaDe(x.ct.dataContrato) || diaDe(x.ct.createdAt)) : (o.inicio || diaDe(o.createdAt));
  return { ...x, f, valor, valorContrato, custos, saldo, recebido: valor - saldo, margem, pct, data, preenchido: custos>0 };
}
function finNoPeriodo(fi){
  if(FIN_PERIODO==='todos') return true;
  const d = parseDia(fi.data); if(!d) return false;
  const h = new Date();
  if(FIN_PERIODO==='mes') return d.getFullYear()===h.getFullYear() && d.getMonth()===h.getMonth();
  if(FIN_PERIODO==='mes_passado'){ const p = new Date(h.getFullYear(), h.getMonth()-1, 1); return d.getFullYear()===p.getFullYear() && d.getMonth()===p.getMonth(); }
  if(FIN_PERIODO==='ano') return d.getFullYear()===h.getFullYear();
  if(FIN_PERIODO==='receber') return fi.saldo > 0.009;
  if(FIN_PERIODO==='retirados') return true;
  return true;
}
window.setFinPeriodo = (k)=>{ FIN_PERIODO = k; renderMain(); };
window.setFinBusca = (v)=>{ FIN_BUSCA = v; const q = v.trim().toLowerCase();
  document.querySelectorAll('.fin-row').forEach(r=>{ r.style.display = !q || r.dataset.busca.includes(q) ? '' : 'none'; }); };
window.abrirFin = (id)=>{ finEditId = id; renderMain(); };
window.fecharFin = ()=>{ finEditId = null; renderMain(); };
window.fmtCampoBRL = (el)=>{ const v = el.value.trim(); if(v==='') return; el.value = fmtMoney(parseBRL(v)); atualizarPreviaFin(); };
window.atualizarPreviaFin = ()=>{
  const vEl = document.getElementById('fin-valor'); if(!vEl) return;
  const g = k=>{ const el = document.getElementById('fin-'+k); return el ? el.value : ''; };
  const valor = g('valor')==='' ? Number(vEl.dataset.contrato||0) : parseBRL(g('valor'));
  const custos = FIN_CUSTOS.reduce((t,c)=>t+parseBRL(g(c.k)),0);
  const saldo = g('saldo')==='' ? valor : parseBRL(g('saldo'));
  const m = valor - custos, pct = valor ? m/valor*100 : 0;
  const set = (id, t, cls)=>{ const el = document.getElementById(id); if(el){ el.textContent = t; if(cls!==undefined) el.className = cls; } };
  set('fin-calc-custos', brl(custos));
  set('fin-calc-margem', brl(m), 'v '+(m<0?'neg':'pos'));
  set('fin-calc-pct', pct.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%');
  set('fin-calc-recebido', brl(valor - saldo));
};
window.salvarFin = async ()=>{
  const o = STATE.obras.find(x=>x.id===finEditId); if(!o) return;
  const g = k=>{ const el = document.getElementById('fin-'+k); return el ? el.value.trim() : ''; };
  const f = o.fin || {};
  f.valorManual = g('valor')==='' ? null : parseBRL(g('valor'));
  f.saldo = g('saldo')==='' ? null : parseBRL(g('saldo'));
  f.fornecedor = g('fornecedor');
  FIN_CUSTOS.forEach(c=>{ f[c.k] = g(c.k)==='' ? null : parseBRL(g(c.k)); });
  f.obs = g('obs');
  o.fin = f; stampUpdated(o);
  await saveKey('obras', STATE.obras);
  finEditId = null; toast('Financeiro do cliente atualizado.'); renderMain();
};
window.ocultarFin = async ()=>{
  const o = STATE.obras.find(x=>x.id===finEditId); if(!o) return;
  if(!confirm('Tirar este cliente do Controle Financeiro? Os valores lançados ficam guardados, e ele pode voltar pelo filtro "Retirados".')) return;
  o.finOculto = true; stampUpdated(o);
  await saveKey('obras', STATE.obras); finEditId = null; renderMain();
};
window.voltarFin = async ()=>{
  const o = STATE.obras.find(x=>x.id===finEditId); if(!o) return;
  delete o.finOculto; stampUpdated(o);
  await saveKey('obras', STATE.obras); finEditId = null; FIN_PERIODO = 'todos'; toast('Cliente de volta ao financeiro.'); renderMain();
};
window.exportFinanceiroXlsx = ()=>{
  if(typeof XLSX==='undefined'){ toast('Exportação indisponível.'); return; }
  const lista = obrasDoFunil().filter(o=>FIN_PERIODO==='retirados' ? o.finOculto : !o.finOculto).map(finInfo).filter(finNoPeriodo);
  if(!lista.length){ toast('Nada para exportar neste filtro.'); return; }
  const rows = lista.map(fi=>{
    const r = { 'Cliente':fi.nome, 'Data do contrato':fi.data?fmtDataBr(fi.data):'', 'Valor da venda':fi.valor, 'Recebido':fi.recebido, 'Saldo a receber':fi.saldo, 'Fornecedor':fi.f.fornecedor||'' };
    FIN_CUSTOS.forEach(c=>{ r[c.t] = Number(fi.f[c.k])||0; });
    r['Custos totais'] = fi.custos; r['Margem de contribuição'] = fi.margem; r['Margem %'] = Math.round(fi.pct*10)/10;
    return r;
  });
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Financeiro');
  XLSX.writeFile(wb, 'SUPERSUNN_Controle_Financeiro_'+hojeIso()+'.xlsx');
};

      </div>

      </div>
      <div class="field" style="margin-top:12px"><label for="fin-obs">Observações</label><textarea id="fin-obs" placeholder="Ex.: entrada de 30% paga; restante na instalação">${esc(f.obs||'')}</textarea></div>
      <div class="ob-modal-acts">

      </div>
    </div></div>`;
}
function viewFinanceiro(){
  syncObras();
  const nRet = obrasDoFunil().filter(o=>o.finOculto).length;
  if(FIN_PERIODO==='retirados' && !nRet) FIN_PERIODO = 'todos';
  const todos = obrasDoFunil().filter(o=>FIN_PERIODO==='retirados' ? o.finOculto : !o.finOculto).map(finInfo);

  const soma = k=>lista.reduce((t,x)=>t+(Number(x[k])||0),0);

  const fatCom = comCusto.reduce((t,x)=>t+x.valor,0), marCom = comCusto.reduce((t,x)=>t+x.margem,0);

      <td data-l="Custos" class="num" title="${esc(det)}">${fi.preenchido?brl0(fi.custos):'<span class="ob-muted">a preencher</span>'}</td>

      <td class="ob-acts"><button class="ob-edit" onclick="abrirFin('${fi.o.id}')" title="Editar" aria-label="Editar financeiro de ${esc(fi.nome)}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></td>
    </tr>`;

      <div class="fin-kpi"><span>Custos</span><b>${brl0(cus)}</b><em>${comCusto.length} de ${lista.length} com custos lançados</em></div>
      <div class="fin-kpi"><span>Margem de contribuição</span><b class="${marCom<0?'neg':'pos'}">${brl0(marCom)}</b><em>${pctMedia.toLocaleString('pt-BR',{maximumFractionDigits:1})}% sobre as vendas com custos</em></div>
    </div>
    <div class="ob-toolbar">
      <div class="ob-chips" role="group" aria-label="Período">${chips}</div>

const DESP_CATS = ['Aluguel','Energia','Água','Internet e telefone','Contabilidade','Salários e pró-labore','Impostos','Marketing e anúncios','Combustível e veículos','Sistemas e software','Material de escritório','Outros'];
let DESP_MES = isoDia(new Date()).slice(0,7);
function ymAdd(ym, n){ const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymNome(ym){ const [y,m] = ym.split('-').map(Number); return MES_NOME[m-1].charAt(0).toUpperCase()+MES_NOME[m-1].slice(1)+' de '+y; }
function despStore(){ const d = STATE.despesas = STATE.despesas || {}; d.recorrentes = d.recorrentes || []; d.meses = d.meses || {}; return d; }
/* linhas do mês: lançadas + recorrentes ainda não lançadas (virtuais, só gravam quando editadas) */
function despLinhas(ym){
  const d = despStore(), lan = d.meses[ym] || [];
  const virt = d.recorrentes.filter(r=>r.inicio<=ym && (!r.fim || r.fim>=ym) && !(r.pulados||[]).includes(ym) && !lan.some(l=>l.recId===r.id))
    .map(r=>({ id:'v_'+r.id, recId:r.id, nome:r.nome, categoria:r.categoria, valor:Number(r.valor)||0, pago:false, virtual:true }));
  return lan.concat(virt);
}
function despTotal(ym){ return despLinhas(ym).reduce((t,l)=>t+(Number(l.valor)||0),0); }
function margemDoMes(ym){
  const vendas = obrasDoFunil().filter(o=>!o.finOculto).map(finInfo).filter(fi=>fi.data && fi.data.slice(0,7)===ym);
  const comCusto = vendas.filter(fi=>fi.preenchido);
  return { vendas: vendas.length, semCusto: vendas.length - comCusto.length,
           venda: vendas.reduce((t,fi)=>t+fi.valor,0), margem: comCusto.reduce((t,fi)=>t+fi.margem,0), vendaComCusto: comCusto.reduce((t,fi)=>t+fi.valor,0) };
}
function despLinhaReal(ym, id){
  const d = despStore(); d.meses[ym] = d.meses[ym] || [];
  let l = d.meses[ym].find(x=>x.id===id) || (id.startsWith('v_') ? d.meses[ym].find(x=>x.recId===id.slice(2)) : null);
  if(!l && id.startsWith('v_')){
    const r = d.recorrentes.find(x=>x.id===id.slice(2)); if(!r) return null;
    l = { id:uid(), recId:r.id, nome:r.nome, categoria:r.categoria, valor:Number(r.valor)||0, pago:false };
    d.meses[ym].push(l);
  }
  return l;
}
window.despMudarMes = (n)=>{ DESP_MES = n===0 ? isoDia(new Date()).slice(0,7) : ymAdd(DESP_MES, n); renderMain(); };
window.despSetValor = async (id, v)=>{ const l = despLinhaReal(DESP_MES, id); if(!l) return; l.valor = parseBRL(v); await saveKey('despesas', STATE.despesas); renderMain(); };
window.despSetPago = async (id, on)=>{ const l = despLinhaReal(DESP_MES, id); if(!l) return; l.pago = !!on; await saveKey('despesas', STATE.despesas); renderMain(); };
window.despRemover = async (id)=>{
  const d = despStore(), lan = d.meses[DESP_MES] || [];
  const l = lan.find(x=>x.id===id) || (id.startsWith('v_') ? {recId:id.slice(2)} : null); if(!l) return;
  if(l.recId){
    const r = d.recorrentes.find(x=>x.id===l.recId);
    if(r){ r.pulados = Array.from(new Set([...(r.pulados||[]), DESP_MES])); }
  }
  d.meses[DESP_MES] = lan.filter(x=>x.id!==id);
  await saveKey('despesas', STATE.despesas); toast(l.recId ? 'Removida deste mês. Ela continua nos outros meses.' : 'Despesa removida.'); renderMain();
};
window.despAdicionar = async ()=>{
  const g = n=>{ const el = document.getElementById('dp-'+n); return el ? el.value.trim() : ''; };
  const nome = g('nome'), categoria = g('cat') || 'Outros', valor = parseBRL(g('valor'));
  const repetir = (document.getElementById('dp-rep')||{}).checked;
  if(!nome){ toast('Dê um nome para a despesa.'); return; }
  if(!valor){ toast('Informe o valor da despesa.'); return; }
  const d = despStore();
  if(repetir) d.recorrentes.push({ id:uid(), nome, categoria, valor, inicio:DESP_MES, fim:'', pulados:[] });
  else { d.meses[DESP_MES] = d.meses[DESP_MES] || []; d.meses[DESP_MES].push({ id:uid(), nome, categoria, valor, pago:false }); }
  await saveKey('despesas', STATE.despesas);
  toast(repetir ? 'Despesa adicionada e vai se repetir todo mês.' : 'Despesa adicionada.'); renderMain();
};
window.recSetValor = async (id, v)=>{ const r = despStore().recorrentes.find(x=>x.id===id); if(!r) return; r.valor = parseBRL(v); await saveKey('despesas', STATE.despesas); renderMain(); };
window.recParar = async (id)=>{
  const r = despStore().recorrentes.find(x=>x.id===id); if(!r) return;
  if(!confirm(`Parar de repetir "${r.nome}" a partir de ${ymNome(DESP_MES).toLowerCase()}? Os meses anteriores não mudam.`)) return;
  r.fim = ymAdd(DESP_MES, -1);
  const lan = despStore().meses; Object.keys(lan).forEach(ym=>{ if(ym>=DESP_MES) lan[ym] = lan[ym].filter(l=>l.recId!==id); });
  await saveKey('despesas', STATE.despesas); renderMain();
};
window.despCopiarAnterior = async ()=>{
  const ant = ymAdd(DESP_MES, -1), d = despStore();
  const avulsas = (d.meses[ant]||[]).filter(l=>!l.recId);
  if(!avulsas.length){ toast('O mês anterior não tem despesas avulsas para copiar.'); return; }
  d.meses[DESP_MES] = (d.meses[DESP_MES]||[]).concat(avulsas.map(l=>({ id:uid(), nome:l.nome, categoria:l.categoria, valor:l.valor, pago:false })));
  await saveKey('despesas', STATE.despesas); toast(avulsas.length+' despesa'+(avulsas.length===1?'':'s')+' copiada'+(avulsas.length===1?'':'s')+' do mês anterior.'); renderMain();
};
window.exportDespesasXlsx = ()=>{
  if(typeof XLSX==='undefined'){ toast('Exportação indisponível.'); return; }
  const rows = []; for(let i=11;i>=0;i--){ const ym = ymAdd(DESP_MES, -i);
    despLinhas(ym).forEach(l=>rows.push({ 'Mês':ymNome(ym), 'Despesa':l.nome, 'Categoria':l.categoria, 'Valor':Number(l.valor)||0, 'Pago':l.pago?'Sim':'Não', 'Repete todo mês':l.recId?'Sim':'Não' })); }
  const res = []; for(let i=11;i>=0;i--){ const ym = ymAdd(DESP_MES, -i), m = margemDoMes(ym), dp = despTotal(ym);
    res.push({ 'Mês':ymNome(ym), 'Vendas':m.venda, 'Margem de contribuição':m.margem, 'Despesas do escritório':dp, 'Lucro final':m.margem-dp, 'Vendas sem custos lançados':m.semCusto }); }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(res), 'Lucro por mês');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{'Mês':'','Despesa':''}]), 'Despesas');
  XLSX.writeFile(wb, 'SUPERSUNN_Despesas_e_Lucro_'+DESP_MES+'.xlsx');
};
function renderDespChart(){
  const cv = document.getElementById('desp-chart'); if(!cv || typeof Chart==='undefined') return;
  if(window.__despChart){ try{ window.__despChart.destroy(); }catch(e){} window.__despChart = null; }
  const meses = []; for(let i=5;i>=0;i--) meses.push(ymAdd(DESP_MES, -i));
  const mg = meses.map(ym=>margemDoMes(ym).margem), dp = meses.map(ym=>despTotal(ym)), lc = meses.map((_,i)=>mg[i]-dp[i]);
  const tick = themeVar('--chart-tick'), grid = themeVar('--chart-grid');
  window.__despChart = new Chart(cv, { data:{ labels:meses.map(ym=>MES_ABR[Number(ym.slice(5))-1]),
      datasets:[
        { type:'bar', label:'Margem de contribuição', data:mg, backgroundColor:'#FF7A00', borderRadius:5, maxBarThickness:26, order:2 },
        { type:'bar', label:'Despesas do escritório', data:dp, backgroundColor:themeVar('--chart-consumo'), borderRadius:5, maxBarThickness:26, order:2 },
        { type:'line', label:'Lucro final', data:lc, borderColor:'#15924F', backgroundColor:'#15924F', borderWidth:3, pointRadius:4, tension:0, order:1 } ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{ position:'top', labels:{ color:tick, boxWidth:12, font:{family:'Montserrat', weight:'600', size:11} } },
        tooltip:{ callbacks:{ label:c=>c.dataset.label+': R$ '+Math.round(c.raw).toLocaleString('pt-BR') } } },
      scales:{ x:{ grid:{display:false}, ticks:{color:tick, font:{family:'Montserrat'}} },

}

/* margem/despesas/lucro no período do filtro + próximos prazos da implantação */
function dashFinImplHtml(P){
  const ini = isoDia(P.ini), fim = isoDia(P.fim);
  const vendas = obrasDoFunil().filter(o=>!o.finOculto).map(finInfo).filter(fi=>fi.data && fi.data>=ini && fi.data<=fim);
  const comCusto = vendas.filter(fi=>fi.preenchido);
  const margem = comCusto.reduce((t,fi)=>t+fi.margem,0), vendaCC = comCusto.reduce((t,fi)=>t+fi.valor,0);
  let desp = 0, nMeses = 0; for(let ym=ini.slice(0,7); ym<=fim.slice(0,7); ym=ymAdd(ym,1)){ desp += despTotal(ym); nMeses++; if(nMeses>36) break; }
  const lucro = margem - desp, pct = vendaCC ? lucro/vendaCC*100 : null;
  const semCusto = vendas.length - comCusto.length;
  const fin = `<article class="dm-card df-card">
      <header><h4>Resultado financeiro</h4><button class="dm-link" onclick="goToTab('despesas')">Ver despesas</button></header>
      <div class="dm-sub">${nMeses>1?nMeses+' meses de despesas no período':'despesas do mês'}${semCusto?` · <span class="dp-warn">${semCusto} venda${semCusto===1?'':'s'} sem custos lançados</span>`:''}</div>
      <button class="df-row" onclick="goToTab('financeiro')"><span>Margem de contribuição</span><b class="${margem<0?'neg':'pos'}">${brl0(margem)}</b></button>
      <button class="df-row" onclick="goToTab('despesas')"><span>Despesas do escritório</span><b class="neg-soft">− ${brl0(desp)}</b></button>
      <div class="df-row df-total ${lucro<0?'neg':''}"><span>Lucro final</span><b class="${lucro<0?'neg':'pos'}">${brl0(lucro)}</b></div>
      <div class="dm-extra">${pct===null?'Sem vendas com custos lançados no período.':pct.toLocaleString('pt-BR',{maximumFractionDigits:1})+'% de lucro sobre as vendas com custos lançados'}</div>
    </article>`;
  // próximos da implantação: em andamento, ordenados pelo prazo final
  const lista = obrasVisiveis().map(obraInfo).filter(x=>!x.concl).sort((a,b)=>(a.restam===null?9999:a.restam)-(b.restam===null?9999:b.restam));
  const linhas = lista.slice(0,6).map(x=>{
    const o = x.o, quando = x.restam===null ? '<span class="ob-tag">sem início</span>' : obraTag(x.restam,'obra');
    return `<li class="lb-item"><button class="lb-main" onclick="abrirObraDash('${o.id}')" title="Abrir no Controle de Implantação">
        <span class="lb-nome">${esc(x.nome)}</span>
        <span class="lb-det">${x.fim?'prazo '+dataCurta(x.fim)+' · ':''}${esc(o.equip||'')}${o.homol?' · '+esc(o.homol==='Aguardando documentação'?'aguard. docs':o.homol):''}</span>
      </button>${quando}</li>`;
  }).join('');
  const impl = `<article class="dm-card df-impl">
      <header><h4>Próximos da implantação</h4><button class="dm-link" onclick="goToTab('controle')">Ver todos${lista.length?' ('+lista.length+')':''}</button></header>
      <div class="dm-sub">clientes em andamento, pelo prazo final da obra</div>
      ${linhas ? `<ul class="lb-list">${linhas}</ul>` : '<div class="lb-empty">Nenhum cliente em implantação. Quando um card for para "Fechado (Ganho)", ele aparece aqui.</div>'}
    </article>`;
  return `<div class="df-grid">${fin}${impl}</div>`;
}

function bindClientForm(){
  const f = document.getElementById('client-form');
  if(!f) return;
  f.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(f);
    const data = Object.fromEntries(fd.entries());
    data.uf = (data.uf||'').toUpperCase();
    if(!confirmClientCpfOk(data, editingClientId)) return;
    if(editingClientId){
      const idx = STATE.clients.findIndex(c=>c.id===editingClientId);
      STATE.clients[idx] = stampUpdated({...STATE.clients[idx], ...data});
      editingClientId=null;
      toast('Cliente atualizado.');
      await saveKey('clients', STATE.clients);
    }else{
      addClientRecord(data);
      toast('Cliente adicionado e incluído no funil de vendas.');
      await saveKey('clients', STATE.clients);
      await saveKey('funnelCards', STATE.funnelCards);
    }
    renderMain();
  };
}

  const client = STATE.clients[idx];

  STATE.funnelCards = STATE.funnelCards.filter(c=>c.clientId!==id);
  openFunnelCardId = null;
  editingClientInModal = false;

/* valor de negócio considerado para um cliente: valor da proposta mais recente dele */
function getClientDealValue(clientId){
  const props = STATE.proposals.filter(p=>p.clientId===clientId);
  if(!props.length) return 0;
  const latest = props.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt))[0];
  return latest.pagamento ? latest.pagamento.vista : (latest.valor||0);
}

function createFunnelCardForClient(clientId){
  if(!STATE.funnelStages || !STATE.funnelStages.length) STATE.funnelStages = DEFAULT_FUNNEL_STAGES.map(s=>({...s}));
  if(STATE.funnelCards.some(c=>c.clientId===clientId)) return;
  STATE.funnelCards.push({
    id: uid(),
    clientId,
    stageId: STATE.funnelStages[0].id,
    createdAt: new Date().toISOString(),
    timeline: [],
    tags: []
  });
}
/* remove cards órfãos (cliente já excluído) e cards duplicados (mais de um card para o mesmo cliente) */
function dedupeAndCleanFunnelCards(){
  let changed = false;
  const seen = new Set();
  const cleaned = [];
  STATE.funnelCards.slice().sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt)).forEach(c=>{
    const clientExists = STATE.clients.some(cl=>cl.id===c.clientId);
    if(!clientExists){ changed = true; return; }
    if(seen.has(c.clientId)){ changed = true; return; }
    seen.add(c.clientId);
    cleaned.push(c);
  });
  if(changed) STATE.funnelCards = cleaned;
  return changed;
}
function ensureAllClientsHaveCards(){
  let changed = dedupeAndCleanFunnelCards();
  STATE.clients.forEach(c=>{
    if(!STATE.funnelCards.some(fc=>fc.clientId===c.id)){ createFunnelCardForClient(c.id); changed = true; }
  });
  if(changed) saveKey('funnelCards', STATE.funnelCards);
}

/* ---------- auto-scroll da tela/quadro ao arrastar um card até a borda ---------- */
let dragAutoScrollRAF = null;
let dragPointer = {x:-1, y:-1};
let dragAutoScrollBound = false;
function bindFunnelAutoScroll(){
  if(dragAutoScrollBound) return;
  dragAutoScrollBound = true;
  document.addEventListener('dragover', (e)=>{ dragPointer.x = e.clientX; dragPointer.y = e.clientY; });
}
function startDragAutoScroll(){
  if(dragAutoScrollRAF) return;
  const step = ()=>{
    const board = document.getElementById('funnel-board');
    if(board && dragPointer.x>=0){
      const rect = board.getBoundingClientRect();
      const edge = 80, speed = 18;
      if(dragPointer.x - rect.left < edge && dragPointer.x >= rect.left - 10) board.scrollLeft -= speed;
      else if(rect.right - dragPointer.x < edge && dragPointer.x <= rect.right + 10) board.scrollLeft += speed;
    }
    if(dragPointer.y>=0){
      const edgeY = 100, speedY = 14;
      if(dragPointer.y < edgeY) window.scrollBy(0, -speedY);
      else if(dragPointer.y > window.innerHeight - edgeY) window.scrollBy(0, speedY);
    }
    dragAutoScrollRAF = requestAnimationFrame(step);
  };
  dragAutoScrollRAF = requestAnimationFrame(step);
}
function stopDragAutoScroll(){
  if(dragAutoScrollRAF){ cancelAnimationFrame(dragAutoScrollRAF); dragAutoScrollRAF=null; }
  dragPointer = {x:-1,y:-1};
}

function bindFunnelDragDrop(){
  const board = document.getElementById('funnel-board');
  if(!board) return;
  board.querySelectorAll('.funnel-card').forEach(el=>{
    el.addEventListener('dragstart', (e)=>{ e.stopPropagation(); draggedFunnelCardId = el.dataset.cardId; el.classList.add('dragging'); startDragAutoScroll(); });
    el.addEventListener('dragend', (e)=>{ e.stopPropagation(); el.classList.remove('dragging'); draggedFunnelCardId = null; stopDragAutoScroll(); });
  });
  board.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('dragstart', (e)=>{
      e.stopPropagation();
      draggedFunnelStageId = handle.dataset.stageId;
      handle.closest('.funnel-col').classList.add('dragging-col');
      startDragAutoScroll();
    });
    handle.addEventListener('dragend', (e)=>{
      e.stopPropagation();
      handle.closest('.funnel-col').classList.remove('dragging-col');
      draggedFunnelStageId = null;
      stopDragAutoScroll();
    });
  });
  board.querySelectorAll('.funnel-col').forEach(col=>{
    col.addEventListener('dragover', (e)=>{
      e.preventDefault();
      col.classList.add(draggedFunnelStageId ? 'dragover-col' : 'dragover');
    });
    col.addEventListener('dragleave', ()=>{ col.classList.remove('dragover'); col.classList.remove('dragover-col'); });
    col.addEventListener('drop', (e)=>{
      e.preventDefault();
      col.classList.remove('dragover'); col.classList.remove('dragover-col');
      if(draggedFunnelStageId){ reorderFunnelStage(draggedFunnelStageId, col.dataset.stageId); draggedFunnelStageId = null; }
      else if(draggedFunnelCardId){ moveFunnelCard(draggedFunnelCardId, col.dataset.stageId); }
    });
  });
}

async function reorderFunnelStage(draggedId, targetId){
  if(draggedId===targetId) return;
  const arr = STATE.funnelStages;
  const fromIdx = arr.findIndex(s=>s.id===draggedId);
  const toIdx = arr.findIndex(s=>s.id===targetId);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = arr.splice(fromIdx,1);
  arr.splice(toIdx,0,moved);
  await saveKey('funnelStages', STATE.funnelStages);
  renderMain();
}

window.moveFunnelCard = async (cardId, stageId)=>{
  const card = STATE.funnelCards.find(c=>c.id===cardId);
  if(!card || card.stageId===stageId){ return; }
  card.stageId = stageId;
  if(stageFechadoIds().includes(stageId)) card.fechadoEm = new Date().toISOString(); else delete card.fechadoEm;
  stampUpdated(card);
  await saveKey('funnelCards', STATE.funnelCards);
  renderMain();
};

window.renameFunnelStage = async (stageId)=>{
  const st = STATE.funnelStages.find(s=>s.id===stageId);
  if(!st) return;
  const nome = prompt('Novo nome da lista:', st.nome);

window.deleteFunnelStage = async (stageId)=>{
  if(STATE.funnelStages.length<=1){ toast('É preciso manter ao menos uma lista no funil.'); return; }
  const hasCards = STATE.funnelCards.some(c=>c.stageId===stageId);
  if(hasCards && !confirm('Esta lista tem cards. Eles serão movidos para a primeira lista do funil. Continuar?')) return;
  const remaining = STATE.funnelStages.filter(s=>s.id!==stageId);
  const fallbackId = remaining[0].id;
  STATE.funnelCards.forEach(c=>{ if(c.stageId===stageId) c.stageId = fallbackId; });
  STATE.funnelStages = remaining;
  await saveKey('funnelStages', STATE.funnelStages);
  await saveKey('funnelCards', STATE.funnelCards);
  renderMain();
};

window.renameFunnelTag = async (tagId)=>{
  const t = STATE.funnelTags.find(x=>x.id===tagId);
  if(!t) return;
  const nome = prompt('Novo nome da etiqueta:', t.nome);
  if(!nome || !nome.trim()) return;

window.deleteFunnelTag = (tagId)=>{
  const idx = STATE.funnelTags.findIndex(t=>t.id===tagId);
  if(idx<0) return;
  const tag = STATE.funnelTags[idx];
  const affectedCardIds = STATE.funnelCards.filter(c=>(c.tags||[]).includes(tagId)).map(c=>c.id);
  STATE.funnelTags.splice(idx,1);
  STATE.funnelCards.forEach(c=>{ if(c.tags) c.tags = c.tags.filter(id=>id!==tagId); });
  renderMain();
  scheduleUndoableDelete(
    `Etiqueta "${tag.nome}" excluída.`,
    async ()=>{ await saveKey('funnelTags', STATE.funnelTags); await saveKey('funnelCards', STATE.funnelCards); },
    ()=>{
      STATE.funnelTags.splice(idx,0,tag);
      affectedCardIds.forEach(cardId=>{
        const c = STATE.funnelCards.find(x=>x.id===cardId);
        if(c){ c.tags = c.tags||[]; if(!c.tags.includes(tagId)) c.tags.push(tagId); }
      });
      renderMain();
    }
  );
};
window.toggleCardTag = async (cardId, tagId)=>{
  const card = STATE.funnelCards.find(c=>c.id===cardId);
  if(!card) return;
  card.tags = card.tags || [];
  if(card.tags.includes(tagId)) card.tags = card.tags.filter(id=>id!==tagId);
  else card.tags.push(tagId);
  await saveKey('funnelCards', STATE.funnelCards);
  renderMain();
};

    const data = Object.fromEntries(fd.entries());
    data.potenciaKwp = parseFloat(data.potenciaKwp);
    data.valor = parseFloat(data.valor);
    if(editingKitId){
      const idx = STATE.kits.findIndex(k=>k.id===editingKitId);
      STATE.kits[idx] = {...STATE.kits[idx], ...data};
      editingKitId=null;
      toast('Kit atualizado.');
    }else{
      STATE.kits.push({id:uid(), ...data});
      toast('Kit adicionado.');
    }
    await saveKey('kits', STATE.kits);
    renderMain();
  };
  const imp = document.getElementById('kit-import-input');
  if(imp) imp.onchange = handleKitImport;
}

window.cancelEditKit = ()=>{ editingKitId=null; renderMain(); };
window.deleteKit = (id)=>{
  const idx = STATE.kits.findIndex(k=>k.id===id);
  if(idx<0) return;
  const kit = STATE.kits[idx];
  STATE.kits.splice(idx,1);
  renderMain();
  scheduleUndoableDelete(
    `Kit "${kit.nome}" excluído.`,
    async ()=>{ await saveKey('kits', STATE.kits); },
    ()=>{ STATE.kits.splice(idx,0,kit); renderMain(); }
  );
};

window.downloadKitTemplate = ()=>{
  const wsData = [
    ["Nome do Kit","Potência do Sistema (kWp)","Descrição do Equipamento","Valor (R$)"],
    ["Kit 2,40 kWp Residencial",2.40,
     "4x Módulos Fotovoltaicos Tsun 600W\n1x Micro Inversor Monofásico 220V Deye 2,25 kWp 2MPPT\n1x Bobina de Cabo FV 6mm² - Vermelho\n1x Bobina de Cabo FV 6mm² - Preto\n2x Conector MC4 - Macho e Fêmea\n1x Kit estrutura para fixação dos módulos em alumínio",
     5490.00]
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:28},{wch:22},{wch:60},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Kits");
  XLSX.writeFile(wb, "modelo_importacao_kits.xlsx");
};

async function handleKitImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  let added=0;
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r[0]) continue;
    const nome = String(r[0]).trim();
    const potenciaKwp = parseFloat(r[1])||0;
    const descricao = String(r[2]||'').trim();
    const valor = parseFloat(r[3])||0;
    // sempre adiciona um novo kit, mesmo que já exista um com o mesmo nome —
    // a planilha pode ter linhas repetidas de propósito (variações do mesmo kit)
    STATE.kits.push({id:uid(), nome, potenciaKwp, descricao, valor});
    added++;
  }
  await saveKey('kits', STATE.kits);
  toast(`Importação concluída: ${added} kits adicionados.`);
  e.target.value='';
  renderMain();
}

/* pré-preenche a etapa de consumo com o que foi salvo na última proposta deste cliente */
function applySavedConsumoToWiz(clientId){
  const client = STATE.clients.find(c=>c.id===clientId);
  if(!client) return;
  WIZ.fin = WIZ.fin || {};
  if(!WIZ.fin.tarifa && client.tarifa) WIZ.fin.tarifa = client.tarifa;
  if(!WIZ.fin.disponibilidade) WIZ.fin.disponibilidade = client.disponibilidade || dispPorClasse(client.classe);
  if(!WIZ.fin.fioB && client.fioB) WIZ.fin.fioB = client.fioB;
  const temMensal = client.consumoMensal && client.consumoMensal.length===12 && client.consumoMensal.some(v=>v);
  if(client.consumoMedia || temMensal){
    WIZ.consumoModo = client.consumoModo || 'media';
    WIZ.consumoMedia = client.consumoMedia || '';
    WIZ.consumoMensal = temMensal ? client.consumoMensal.slice() : new Array(12).fill('');
  }
}
window.startProposalForClient = (clientId)=>{
  WIZ = freshWizard();
  WIZ.clientId = clientId;
  applySavedConsumoToWiz(clientId);
  openFunnelCardId = null;
  ACTIVE_TAB = 'nova';
  renderMain();
  window.scrollTo({top:0, behavior:'smooth'});
};

function viewNovaProposta(){
  if(!WIZ) WIZ = freshWizard();
  const steps=['Cliente','Consumo','Localização & Kit','Pagamento','Pré-visualização'];
  const dots = steps.map((s,i)=>{
    const n=i+1;
    const cls = n===WIZ.step?'active':(n<WIZ.step?'done':'');
    return `<div class="step-dot ${cls}">${n}. ${s}</div>`;
  }).join('');

  let body='';
  if(WIZ.step===1) body = stepCliente();
  else if(WIZ.step===2) body = stepConsumo();
  else if(WIZ.step===3) body = stepKit();
  else if(WIZ.step===4) body = stepPagamento();
  else if(WIZ.step===5) body = stepPreview();

  return `<div class="step-nav">${dots}</div>${body}`;
}

/* retorna o valor numérico do kit a exibir no campo editável: o override já

  const entradaValorNum = parseFloat(WIZ.entradaValor)||0;

      inversoresQtd: document.getElementById('wiz-ce-invqtd').value,

/* ---------- financial math ---------- */
function priceInstallment(pv, taxaMensalPct, n){
  const i = taxaMensalPct/100;
  if(i<=0) return pv/n;
  return pv * i / (1-Math.pow(1+i,-n));
}

/* ---------- proposal calculation ---------- */
function computeCurrentProposal(){
  if(!WIZ.clientId) return null;
  const client = STATE.clients.find(c=>c.id===WIZ.clientId);
  if(!client) return null;

  let consumoMensalArr, consumoMedia;
  if(WIZ.consumoModo==='media'){
    if(!WIZ.consumoMedia) return null;
    consumoMedia = parseFloat(WIZ.consumoMedia);
    consumoMensalArr = new Array(12).fill(consumoMedia);
  }else{
    if(WIZ.consumoMensal.some(v=>!v)) return null;
    consumoMensalArr = WIZ.consumoMensal.map(Number);
    consumoMedia = consumoMensalArr.reduce((a,b)=>a+b,0)/12;
  }

  const irr = STATE.irradiation.find(r=>r.id===WIZ.cidadeIrrId);
  if(!irr) return null;

  let kwp, descricao, valor, nomeKit;
  if(WIZ.kitCustom){
    if(!WIZ.customPotencia||!WIZ.customValor) return null;
    kwp = parseFloat(WIZ.customPotencia);
    valor = parseFloat(WIZ.customValor);
    descricao = WIZ.customDescricao;
    nomeKit = 'Sistema personalizado';
  }else{
    const kit = STATE.kits.find(k=>k.id===WIZ.kitId);
    if(!kit) return null;
    const valorOverride = parseFloat(WIZ.kitValorOverride);
    const potenciaOverride = parseFloat(WIZ.kitPotenciaOverride);
    kwp = (WIZ.kitPotenciaOverride!==undefined && WIZ.kitPotenciaOverride!=='' && !isNaN(potenciaOverride) && potenciaOverride>0) ? potenciaOverride : kit.potenciaKwp;
    valor = (WIZ.kitValorOverride!==undefined && WIZ.kitValorOverride!=='' && !isNaN(valorOverride) && valorOverride>0) ? valorOverride : kit.valor;
    descricao = (WIZ.kitDescricaoOverride!==undefined && WIZ.kitDescricaoOverride!=='') ? WIZ.kitDescricaoOverride : kit.descricao;
    nomeKit = kit.nome;
  }

  const pr = WIZ.performanceRatio||0.78;
  const geracaoMensalArr = DAYS_IN_MONTH.map(d => kwp * irr.hsp * d * pr);
  const geracaoMediaMensal = geracaoMensalArr.reduce((a,b)=>a+b,0)/12;

  let adequacaoPadrao = null;
  let descricaoFinal = descricao;
  let investimento = valor;
  if(WIZ.temAdequacaoPadrao && WIZ.adequacaoValor){
    const orientacaoLabel = WIZ.adequacaoOrientacao==='contra' ? 'padrão contra a rede' : 'padrão a favor da rede';
    adequacaoPadrao = { orientacao: WIZ.adequacaoOrientacao, valor: parseFloat(WIZ.adequacaoValor) };
    descricaoFinal = (descricaoFinal? descricaoFinal+'\n':'') + `Padrão CMA-2 com disjuntor de 63A Bipolar (${orientacaoLabel})`;
    investimento = valor + adequacaoPadrao.valor;
  }

  const calc = {
    client, consumoMensalArr, consumoMedia, irr, kwp, descricao: descricaoFinal, valor, nomeKit,
    geracaoMensalArr, geracaoMediaMensal, investimento, adequacaoPadrao, pr, contratoEquip: WIZ.contratoEquip
  };
  calc.finInputs = finInputsFrom(WIZ.fin, client);
  calc.fin = computeFin(calc, calc.finInputs, new Date());
  return calc;
}

function themeVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#0B1F4B'; }
function renderPreviewChart(calc){
  const ctx = document.getElementById('preview-chart');
  if(!ctx) return;
  if(window.__previewChartObj) window.__previewChartObj.destroy();
  window.__previewChartObj = new Chart(ctx, {
    type:'bar',
    data:{ labels:MONTHS,
      datasets:[
        {label:'Consumo', data:calc.consumoMensalArr, backgroundColor:themeVar('--chart-consumo'), borderRadius:4},
        {label:'Geração', data:calc.geracaoMensalArr, backgroundColor:'#FF7A00', borderRadius:4}
      ]},
    options:{responsive:true, plugins:{legend:{position:'top', labels:{color:themeVar('--chart-tick'), font:{family:'Montserrat', weight:'600'}}}},
      scales:{x:{grid:{display:false}, ticks:{color:themeVar('--chart-tick'), font:{family:'Montserrat'}}},
              y:{beginAtZero:true, grid:{color:themeVar('--chart-grid')}, ticks:{color:themeVar('--chart-tick'), font:{family:'Montserrat'}}}}}
  });
  renderPreviewFinChart(calc.fin);
}

/* ---------- shared helpers: pagamento + record ---------- */
function computePagamento(calc){
  const cr=STATE.cardRates, bk=STATE.bank;
  const entradaValorNum = parseFloat(WIZ.entradaValor)||0;
  const entradaRestante = Math.max(calc.investimento - entradaValorNum, 0);
  const entradaParcelasNum = Math.max(parseInt(WIZ.entradaParcelas)||1, 1);
  const entradaParcela = WIZ.entradaTipo==='comjuros'
    ? priceInstallment(entradaRestante, cr.comJurosTaxaMensal, entradaParcelasNum)
    : entradaRestante/entradaParcelasNum;
  return {
    semJurosN: WIZ.formaPagCartaoParcelasSemJuros, semJurosParcela: calc.investimento/WIZ.formaPagCartaoParcelasSemJuros,
    comJurosN: WIZ.formaPagCartaoParcelasComJuros, comJurosParcela: priceInstallment(calc.investimento, cr.comJurosTaxaMensal, WIZ.formaPagCartaoParcelasComJuros), comJurosTaxa: cr.comJurosTaxaMensal,
    bancoN: WIZ.formaPagBancoParcelas, bancoParcela: priceInstallment(calc.investimento, bk.taxaMensal, WIZ.formaPagBancoParcelas), bancoTaxa: bk.taxaMensal,
    vista: calc.investimento,
    mostrarSemJuros: WIZ.mostrarSemJuros!==false,
    mostrarComJuros: WIZ.mostrarComJuros!==false,
    mostrarBanco: WIZ.mostrarBanco!==false,
    mostrarVista: WIZ.mostrarVista!==false,
    usarEntrada: !!WIZ.usarEntrada,
    mostrarEntrada: WIZ.mostrarEntrada!==false,
    entradaValor: entradaValorNum,
    entradaTipo: WIZ.entradaTipo||'semjuros',
    entradaRestante,
    entradaParcelasN: entradaParcelasNum,
    entradaParcela
  };
}
function buildProposalRecord(calc, pagamento){
  return stampCreated({
    id: uid(),
    clientId: WIZ.clientId, clientNome: calc.client.nome,
    consumoModo: WIZ.consumoModo, consumoMensalArr: calc.consumoMensalArr, consumoMedia: calc.consumoMedia,
    cidade: calc.irr.cidade, uf: calc.irr.uf, hsp: calc.irr.hsp,
    kwp: calc.kwp, descricao: calc.descricao, nomeKit: calc.nomeKit, valor: calc.valor,
    investimento: calc.investimento, pr: calc.pr,
    geracaoMensalArr: calc.geracaoMensalArr, geracaoMediaMensal: calc.geracaoMediaMensal,
    adequacaoPadrao: calc.adequacaoPadrao || null,
    numero: calc.numero || nextProposalNumber(), dataEmissao: calc.dataEmissao || new Date().toISOString(),
    consultor: calc.consultor || CURRENT_USER_NAME || propSettings().consultorPadrao || '',
    finInputs: calc.finInputs || null,
    finResumo: calc.fin ? { economiaPct: calc.fin.economiaPct, economiaMensal: calc.fin.economiaMensal, payback: calc.fin.payback,
      economiaTotal: calc.fin.economiaTotal, tir: calc.fin.tir, roi: calc.fin.roi } : null,
    contratoEquip: WIZ.contratoEquip,
    pagamento,
    status: 'Enviada', versionOf: null, versionNumber: 1
  });
}
async function persistProposal(calc, pagamento){
  const record = buildProposalRecord(calc, pagamento);
  STATE.proposals.push(record);
  await saveKey('proposals', STATE.proposals);
  // guarda o consumo usado nesta proposta na ficha do cliente, para
  // pré-preencher automaticamente a próxima proposta que ele solicitar
  const client = STATE.clients.find(c=>c.id===WIZ.clientId);
  if(client){
    client.consumoModo = WIZ.consumoModo;
    client.consumoMedia = calc.consumoMedia;
    client.consumoMensal = calc.consumoMensalArr.slice();
    await saveKey('clients', STATE.clients);
  }
  return record;
}

/* ---------- save proposal (manual button, keeps you on the preview) ---------- */
window.salvarProposta = async (btn)=>{
  await runBusy(btn, 'Salvando...', async ()=>{
    const calc = computeCurrentProposal();
    if(!calc){ toast('Complete todas as etapas antes de salvar.'); return; }
    calc.numero = nextProposalNumber(); calc.dataEmissao = new Date().toISOString();
    await persistProposal(calc, computePagamento(calc));
    toast('Proposta salva com sucesso.');
  });
};

window.deleteProposal = (id)=>{
  const idx = STATE.proposals.findIndex(p=>p.id===id);
  if(idx<0) return;
  const proposal = STATE.proposals[idx];
  STATE.proposals.splice(idx,1);
  renderMain();
  scheduleUndoableDelete(
    `Proposta de "${proposal.clientNome||'cliente'}" excluída.`,
    async ()=>{ await saveKey('proposals', STATE.proposals); },
    ()=>{
      STATE.proposals.splice(idx,0,proposal);
      renderMain();
    }
  );
};
window.setProposalStatus = async (id, status)=>{
  const p = STATE.proposals.find(x=>x.id===id);
  if(!p || !PROPOSAL_STATUSES.includes(status)) return;
  p.status = status;
  stampUpdated(p);
  await saveKey('proposals', STATE.proposals);

/* ---------- espera robusta por fontes carregadas (evita timeout fixo "no escuro") ---------- */
async function waitFontsReady(timeoutMs){
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  const timeout = new Promise(r=>setTimeout(r, timeoutMs));
  await Promise.race([fontsReady, timeout]);
  // dá um respiro para o navegador aplicar o layout com as fontes já carregadas
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
}
/* avisa (uma vez, sem travar a geração) se as fontes "Codec Pro" não estiverem
   instaladas no computador — elas são carregadas via local(), então, se não
   estiverem instaladas no sistema operacional de quem gera o PDF, o navegador
   usa a fonte de fallback (Segoe UI/Arial) sem avisar. */
let fontsWarnedOnce = false;
function checkCodecFontsAvailable(){
  if(!document.fonts || !document.fonts.check) return true;
  try{
    const ok = document.fonts.check("800 30px 'Montserrat'") && document.fonts.check("400 12px 'Montserrat'");
    if(!ok && !fontsWarnedOnce){
      fontsWarnedOnce = true;
      toast('Aviso: a fonte Montserrat não carregou (sem internet?) — o PDF será gerado com a fonte padrão no lugar.');
    }
    return ok;
  }catch(e){ return true; }
}
/* espera o Chart.js terminar de desenhar antes de rasterizar (em vez de um
   setTimeout arbitrário que pode ser curto demais em máquinas mais lentas) */
function waitChartRendered(chart, timeoutMs){
  return new Promise(resolve=>{
    let done = false;
    const finish = ()=>{ if(!done){ done = true; resolve(); } };
    chart.options.animation = { onComplete: finish };
    chart.update();
    setTimeout(finish, timeoutMs); // rede de segurança
  });
}

async function buildAndDownloadPdf(calc, pagamento){
  const area = document.getElementById('pdf-render-area');
  try{
    // sanity-check that the external libraries actually loaded
    const missing = [];
    if(typeof Chart==='undefined') missing.push('Chart.js');
    if(typeof html2canvas==='undefined') missing.push('html2canvas');
    if(!window.jspdf || !window.jspdf.jsPDF) missing.push('jsPDF');
    if(missing.length){
      toast('Não foi possível carregar: '+missing.join(', ')+'. Verifique sua conexão e recarregue a página.');
      console.error('Bibliotecas ausentes:', missing);
      return false;
    }

    toast('Gerando PDF, aguarde...');
    area.innerHTML = pdfPagesHtml(calc, pagamento);

    await waitFontsReady(2500);
    checkCodecFontsAvailable();

    // render chart into o canvas oculto
    const chart = new Chart(document.getElementById('pdf-chart-canvas'), consumoChartConfig(calc, false));
    await waitChartRendered(chart, 1200);
    let chartFin = null;
    const finCanvas = document.getElementById('pdf-fin-canvas');
    if(finCanvas && calc.fin){ chartFin = new Chart(finCanvas, finChartConfig(calc.fin, false)); await waitChartRendered(chartFin, 1200); }

    const pages = area.querySelectorAll('.pdfpage');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();

    const failedPages = [];
    let renderedAny = false;
    for(let i=0;i<pages.length;i++){
      let canvas;
      try{
        canvas = await html2canvas(pages[i], {scale:2, useCORS:true, backgroundColor:'#FFFFFF'});
      }catch(pageErr){
        console.error(`Erro ao renderizar a página ${i+1} do PDF:`, pageErr);
        failedPages.push(i+1);
        continue;
      }
      const img = canvas.toDataURL('image/jpeg',0.95);
      if(renderedAny) pdf.addPage();
      // scale proportionally to the page width; only stretch to full page
      // height for the cover (which is intentionally full-bleed A4)
      const imgH = (canvas.height * pw) / canvas.width;
      pdf.addImage(img,'JPEG',0,0,pw, Math.min(imgH, ph));
      renderedAny = true;
    }
    chart.destroy();
    if(chartFin) chartFin.destroy();

    if(!renderedAny){
      toast('Não foi possível gerar nenhuma página do PDF. Tente novamente.');
      return false;
    }

    const fname = `Proposta_SUPERSUNN_${(calc.client.nome||'cliente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')}.pdf`;
    pdf.save(fname);
    if(failedPages.length){
      toast(`PDF gerado, mas as páginas ${failedPages.join(', ')} falharam e foram omitidas. Tente gerar novamente.`);
    }else{
      toast('PDF gerado com sucesso.');
    }
    return true;
  }catch(err){
    console.error('Erro ao gerar PDF:', err);
    toast('Erro ao gerar o PDF: '+(err && err.message ? err.message : err));
    return false;
  }finally{
    area.innerHTML='';
  }
}

/* =========================================================================
   SUPERSUNN — PARÂMETROS, CÁLCULOS FINANCEIROS (LEI 14.300) E CONTEÚDO DA PROPOSTA
   -------------------------------------------------------------------------
   Regras usadas no cálculo da conta COM energia solar (Lei 14.300/2022 e
   REN ANEEL 1.059/2023, sistemas novos — "GD II"):
   • Parte da geração é consumida na hora (simultaneidade) e nem passa pelo
     medidor: não é compensada e não paga Fio B.
   • O restante é injetado na rede e vira crédito (kWh), que abate o consumo
     puxado da rede. Sobras ficam acumuladas para os meses seguintes.
   • Sobre a energia compensada incide um percentual da TUSD Fio B, que sobe
     ano a ano: 15% (2023), 30% (2024), 45% (2025), 60% (2026), 75% (2027),
     90% (2028) e, a partir de 2029, a regra do art. 17 (aqui: 100%, editável).
   • A conta de energia é o MAIOR valor entre:
       (a) custo de disponibilidade (30/50/100 kWh × tarifa), ou
       (b) consumo da rede não compensado × tarifa + Fio B sobre a energia compensada
     — sem cobrança em duplicidade, conforme esclarecido pela ANEEL.
   • Iluminação pública (CIP) entra nas duas contas (com e sem solar).
   • Tarifa e Fio B reajustam todo ano; os módulos perdem eficiência ao ano.
   ========================================================================= */
const DEFAULT_CALC = {
  reajusteTarifa: 6,          // % ao ano
  degradacao: 0.5,            // % ao ano
  simultaneidade: 46,         // % padrão quando a classe não for reconhecida
  simultPorClasse: { residencial:46, comercial:63, rural:53, servicoPublico:57, industrial:69, poderPublico:63 }, // fator de ajuste regulatório por classe
  fioBPctTarifa: 25,          // estimativa do Fio B como % da tarifa (quando o valor real não for informado)
  fioBCronograma: {2023:15, 2024:30, 2025:45, 2026:60, 2027:75, 2028:90},
  fioBApos2028: 100,          // % do Fio B a partir de 2029 (art. 17 — premissa conservadora)
  iluminacaoPublica: 50,      // R$/mês — sempre considerada nas duas contas (com e sem solar)
  manutencaoAnual: 0,         // R$/ano (limpeza/manutenção), reajustado com a tarifa
  anosAnalise: 25,
  areaPorModulo: 2.66,        // m² por módulo (600 W: 1,13 m × 2,35 m)
  prazoConexaoDias: 60        // dias entre a proposta e o início da compensação
};

function calcParams(){ const sp=STATE.calcParams||{}; return {...DEFAULT_CALC, ...sp, fioBCronograma:{...DEFAULT_CALC.fioBCronograma, ...(sp.fioBCronograma||{})}, simultPorClasse:{...DEFAULT_CALC.simultPorClasse, ...(sp.simultPorClasse||{})}}; }
const CLASSES_SIMULT = [['residencial','Residencial'],['comercial','Comércio, serviços e outras atividades'],['rural','Rural'],['servicoPublico','Serviço Público'],['industrial','Industrial'],['poderPublico','Poder Público']];
function classeKey(classe){
  const c=(classe||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(c.includes('servico publico')) return 'servicoPublico';
  if(c.includes('poder publico')) return 'poderPublico';
  if(c.includes('industrial')) return 'industrial';
  if(c.includes('rural')) return 'rural';
  if(c.includes('comerc')) return 'comercial';
  if(c.includes('residenc')) return 'residencial';
  return null;
}
function simultPorClasse(classe){ const P=calcParams(), k=classeKey(classe); return k ? Number(P.simultPorClasse[k]) : Number(P.simultaneidade); }
function propSettings(){ return {...DEFAULT_PROPOSAL_SETTINGS, ...(STATE.proposalSettings||{})}; }

function dispPorClasse(classe){
  const c = (classe||'').toLowerCase();
  if(c.includes('tri') || c.includes('industrial')) return 100;
  if(c.includes('bi')) return 50;
  return 30;
}
function fioBPctAno(ano, P){
  if(ano < 2023) return 0;
  const v = P.fioBCronograma ? P.fioBCronograma[ano] : undefined;
  return (v!==undefined && v!==null && v!=='') ? Number(v) : Number(P.fioBApos2028);
}
function dataInicioCompensacao(baseDate, P){
  const d = new Date(baseDate || Date.now());
  d.setDate(d.getDate() + (Number(P.prazoConexaoDias)||0));
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function tirAnual(fluxos){
  const npv = r => fluxos.reduce((s,f,t)=>s + f/Math.pow(1+r,t), 0);
  let lo = -0.99, hi = 5;
  if(npv(lo)*npv(hi) > 0) return null;
  for(let i=0;i<200;i++){
    const mid = (lo+hi)/2;
    if(npv(lo)*npv(mid) <= 0) hi = mid; else lo = mid;
  }
  return (lo+hi)/2;
}
function fmtInt(n){ return Math.round(Number(n)||0).toLocaleString('pt-BR'); }
function fmtAnosMeses(anos){
  if(anos===null || anos===undefined || !isFinite(anos)) return 'acima de 25 anos';
  let a = Math.floor(anos), m = Math.round((anos - a)*12);
  if(m===12){ a++; m=0; }
  const sa = a ? `${a} ano${a>1?'s':''}` : '';
  const sm = m ? `${m} ${m>1?'meses':'mês'}` : '';
  return [sa, sm].filter(Boolean).join(' e ') || 'menos de 1 mês';
}

/* entradas financeiras da proposta (tarifa, disponibilidade, Fio B...) a partir
   do que foi digitado no assistente, com os padrões do cliente/configuração */
function finInputsFrom(wizFin, client){
  const P = calcParams();
  const tarifa = parseFloat(wizFin && wizFin.tarifa) || parseFloat(client && client.tarifa) || 0;
  const disp = parseFloat(wizFin && wizFin.disponibilidade) || parseFloat(client && client.disponibilidade) || dispPorClasse(client && client.classe);
  const fioBInf = parseFloat(wizFin && wizFin.fioB);
  const fioB = (fioBInf>0) ? fioBInf : tarifa * (P.fioBPctTarifa/100);
  const cip = (wizFin && wizFin.iluminacao!=='' && wizFin.iluminacao!==undefined) ? (parseFloat(wizFin.iluminacao)||0) : (Number(P.iluminacaoPublica)||0);
  const simult = (wizFin && wizFin.simultaneidade!=='' && wizFin.simultaneidade!==undefined) ? (parseFloat(wizFin.simultaneidade)||0) : simultPorClasse(client && client.classe);
  return { tarifa, disp, fioB, fioBEstimado: !(fioBInf>0), cip, simult };
}

function simulateFinance(o, P){
  const N = Number(P.anosAnalise)||25, r = Number(P.reajusteTarifa)/100, dg = Number(P.degradacao)/100, sim = Math.min(Math.max(o.simult/100,0),1);
  const startY = o.inicio.getFullYear(), startM = o.inicio.getMonth();
  let credito = 0, acc = -o.investimento, payback = null;
  const anos = [], fluxos = [-o.investimento];
  for(let a=0; a<N; a++){
    let semA=0, comA=0, gerA=0, fioA=0;
    const fatorT = Math.pow(1+r, a);
    for(let k=0; k<12; k++){
      const idx = a*12 + k, cm = (startM+idx)%12, y = startY + Math.floor((startM+idx)/12);
      const tf = o.tarifa*fatorT, fb = o.fioB*fatorT, cip = o.cip;
      const G = o.geracaoMensalArr[cm]*Math.pow(1-dg, a), C = o.consumoMensalArr[cm];
      const S = Math.min(G*sim, C);
      const inj = G - S, rede = C - S;
      const disponivel = credito + inj;
      const K = Math.min(disponivel, rede);
      credito = disponivel - K;
      const naoComp = rede - K;
      const pct = fioBPctAno(y, P)/100;
      const fio = K*fb*pct;
      const energiaCom = Math.max(naoComp*tf + fio, o.disp*tf);
      semA += C*tf + cip;
      comA += energiaCom + cip;
      gerA += G; fioA += fio;
    }
    const manut = (Number(P.manutencaoAnual)||0)*fatorT;
    const economia = semA - comA - manut;
    const accAnt = acc;
    acc += economia;
    if(payback===null && acc >= 0) payback = a + (economia>0 ? (-accAnt/economia) : 0);
    fluxos.push(economia);
    const anoRef = startY + a + (startM>=6?1:0);   // ano civil com a maior parte dos 12 meses
    anos.push({ ano: a+1, anoCal: anoRef, contaSem: semA, contaCom: comA, manut, economia, acumulado: acc, geracao: gerA, fioB: fioA,
                pctFioB: fioBPctAno(anoRef, P) });
  }
  const a1 = anos[0];
  const economiaTotal = anos.reduce((s,x)=>s+x.economia,0);
  const tir = tirAnual(fluxos);
  return {
    anos, payback, tir,
    contaSemMensal: a1.contaSem/12, contaComMensal: a1.contaCom/12,
    economiaMensal: (a1.contaSem - a1.contaCom)/12,
    economiaPct: a1.contaSem>0 ? (1 - a1.contaCom/a1.contaSem)*100 : 0,
    economiaTotal, gastoSemTotal: anos.reduce((s,x)=>s+x.contaSem,0),
    gastoComTotal: o.investimento + anos.reduce((s,x)=>s+x.contaCom+x.manut,0),
    roi: o.investimento>0 ? (economiaTotal - o.investimento)/o.investimento*100 : 0,
    pctFioBInicio: anos[0].pctFioB, anoInicio: anos[0].anoCal, mesInicio: startM
  };
}

/* calcula tudo a partir do "calc" técnico (consumo, geração, investimento) */
function computeFin(calc, finInputs, baseDate){
  const P = calcParams();
  if(!finInputs || !(finInputs.tarifa>0) || !calc.investimento) return null;
  const inicio = dataInicioCompensacao(baseDate, P);
  const r = simulateFinance({...finInputs, consumoMensalArr: calc.consumoMensalArr, geracaoMensalArr: calc.geracaoMensalArr,
    investimento: calc.investimento, inicio}, P);
  r.inputs = finInputs;
  r.params = { reajusteTarifa:P.reajusteTarifa, degradacao:P.degradacao, anosAnalise:P.anosAnalise, fioBApos2028:P.fioBApos2028, simultaneidade: finInputs.simult };
  return r;
}
function kwpSugerido(consumoMedia, disp, hsp, pr){
  const alvo = Math.max(consumoMedia - disp, 0);
  return hsp>0 && pr>0 ? alvo / (hsp * 30.42 * pr) : 0;
}
function nextProposalNumber(){
  const ano = new Date().getFullYear();
  const doAno = STATE.proposals.filter(p=>(p.numero||'').endsWith('/'+ano)).length;
  return `${String(doAno+1).padStart(4,'0')}/${ano}`;
}

function bindSupersunnConfigForms(){
  const fc = document.getElementById('form-calc');
  if(fc && !fc.dataset.bound){
    fc.dataset.bound='1';
    fc.addEventListener('submit', async(e)=>{
      e.preventDefault();
      const fd = new FormData(fc), P = calcParams();
      CLASSES_SIMULT.forEach(([k])=>{ const v=parseFloat(fd.get('sim_'+k)); if(!isNaN(v)) P.simultPorClasse[k]=v; });
      ['reajusteTarifa','degradacao','anosAnalise','fioBPctTarifa','iluminacaoPublica','manutencaoAnual','areaPorModulo','prazoConexaoDias','fioBApos2028']
        .forEach(k=>{ const v=parseFloat(fd.get(k)); if(!isNaN(v)) P[k]=v; });
      [2023,2024,2025,2026,2027,2028].forEach(a=>{ const v=parseFloat(fd.get('fb'+a)); if(!isNaN(v)) P.fioBCronograma[a]=v; });
      STATE.calcParams = P;
      await saveKey('calcParams', STATE.calcParams);
      toast('Parâmetros de cálculo salvos.');
    });
  }
  const fp = document.getElementById('form-propset');
  if(fp && !fp.dataset.bound){
    fp.dataset.bound='1';
    fp.addEventListener('submit', async(e)=>{
      e.preventDefault();
      STATE.proposalSettings = {...propSettings(), ...Object.fromEntries(new FormData(fp).entries())};
      await saveKey('proposalSettings', STATE.proposalSettings);
      toast('Conteúdo da proposta salvo.');
    });
  }
}

function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ---------- number to words (pt-BR), used by contract generation ---------- */
const NUM_UNIDADES=['','um','dois','três','quatro','cinco','seis','sete','oito','nove'];
const NUM_DEZ_A_DEZENOVE=['dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const NUM_DEZENAS=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const NUM_CENTENAS=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function numTresDigitos(n){
  if(n===0) return '';
  if(n===100) return 'cem';
  const c=Math.floor(n/100), r=n%100;
  let parts=[];
  if(c) parts.push(NUM_CENTENAS[c]);
  if(r){
    if(r<10) parts.push(NUM_UNIDADES[r]);
    else if(r<20) parts.push(NUM_DEZ_A_DEZENOVE[r-10]);
    else{
      const d=Math.floor(r/10), u=r%10;
      parts.push(NUM_DEZENAS[d] + (u? ' e '+NUM_UNIDADES[u] : ''));
    }
  }
  return parts.join(' e ');
}
function numToWordsPtBR(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n===0) return 'zero';
  const groups = [
    {v:1000000000, s:['bilhão','bilhões']},
    {v:1000000, s:['milhão','milhões']},
    {v:1000, s:['mil','mil']},
    {v:1, s:['','']},
  ];
  let remaining = n, parts=[];
  for(const g of groups){
    if(remaining>=g.v){
      const qty = Math.floor(remaining/g.v);
      remaining = remaining % g.v;
      if(g.v===1){ parts.push(numTresDigitos(qty)); }
      else if(g.v===1000 && qty===1){ parts.push('mil'); }
      else{ parts.push(numTresDigitos(qty)+' '+(qty===1?g.s[0]:g.s[1])); }
    }
  }
  // join with " e " before the last group when appropriate, otherwise comma-like join
  return parts.filter(Boolean).join(' e ');
}
function qtdExtenso(n){ return numToWordsPtBR(n); }
function valorExtenso(valor){
  valor = Number(valor)||0;
  const inteiro = Math.floor(valor);
  const centavos = Math.round((valor-inteiro)*100);
  let txt = numToWordsPtBR(inteiro) + ' ' + (inteiro===1?'real':'reais');
  if(centavos>0){
    txt += ' e ' + numToWordsPtBR(centavos) + ' ' + (centavos===1?'centavo':'centavos');
  }
  return txt;
}

/* ---------- validação de CPF/CNPJ e checagem de cadastro duplicado ---------- */
function validarCPF(cpfDigits){
  if(cpfDigits.length!==11 || /^(\d)\1{10}$/.test(cpfDigits)) return false;
  let soma=0;
  for(let i=0;i<9;i++) soma += parseInt(cpfDigits[i],10)*(10-i);
  let resto = (soma*10)%11;
  if(resto===10||resto===11) resto=0;
  if(resto !== parseInt(cpfDigits[9],10)) return false;
  soma=0;
  for(let i=0;i<10;i++) soma += parseInt(cpfDigits[i],10)*(11-i);
  resto = (soma*10)%11;
  if(resto===10||resto===11) resto=0;
  if(resto !== parseInt(cpfDigits[10],10)) return false;
  return true;
}
function validarCNPJ(cnpjDigits){
  if(cnpjDigits.length!==14 || /^(\d)\1{13}$/.test(cnpjDigits)) return false;
  const calc = (base)=>{
    let tamanho = base.length;
    let pos = tamanho - 7;
    let soma = 0;
    for(let i=tamanho;i>=1;i--){
      soma += parseInt(base.charAt(tamanho-i),10) * pos--;
      if(pos < 2) pos = 9;
    }
    const resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
    return resultado;
  };
  const d1 = calc(cnpjDigits.substring(0,12));
  if(d1 !== parseInt(cnpjDigits.charAt(12),10)) return false;
  const d2 = calc(cnpjDigits.substring(0,13));
  if(d2 !== parseInt(cnpjDigits.charAt(13),10)) return false;
  return true;
}
/* true = válido OU não aplicável (campo vazio ou com tamanho incompleto,
   que não é nosso papel bloquear); false = CPF/CNPJ com 11 ou 14 dígitos
   mas com dígito verificador incorreto */
function cpfCnpjValido(valor){
  const d = onlyDigits(valor);
  if(d.length===11) return validarCPF(d);
  if(d.length===14) return validarCNPJ(d);
  return true;
}
function findClientByCpf(cpfDigits, excludeClientId){
  if(!cpfDigits) return null;
  return STATE.clients.find(c => c.id!==excludeClientId && onlyDigits(c.cpf)===cpfDigits) || null;
}
/* checagem combinada usada antes de salvar um cliente: avisa (sem bloquear
   de forma irreversível) sobre CPF/CNPJ inválido ou já cadastrado, e deixa
   a pessoa decidir se quer salvar mesmo assim */
function confirmClientCpfOk(data, excludeClientId){
  const digits = onlyDigits(data.cpf);
  if(!digits) return true;
  if((digits.length===11 || digits.length===14) && !cpfCnpjValido(data.cpf)){
    if(!confirm('O CPF/CNPJ informado parece inválido (o dígito verificador não confere). Deseja salvar mesmo assim?')) return false;
  }
  const dup = findClientByCpf(digits, excludeClientId);
  if(dup){
    if(!confirm(`Já existe um cliente cadastrado com esse CPF/CNPJ: "${dup.nome}". Deseja salvar mesmo assim?`)) return false;
  }
  return true;
}

/* ---------- máscaras de digitação (CPF/CNPJ, telefone, CEP) ---------- */
function onlyDigits(v){ return (v||'').replace(/\D/g,''); }
function maskCPFCNPJ(v){
  let d = onlyDigits(v).slice(0,14);
  if(d.length<=11){
    d = d.replace(/(\d{3})(\d)/, '$1.$2');
    d = d.replace(/(\d{3})(\d)/, '$1.$2');
    d = d.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  }else{
    d = d.replace(/(\d{2})(\d)/, '$1.$2');
    d = d.replace(/(\d{3})(\d)/, '$1.$2');
    d = d.replace(/(\d{3})(\d)/, '$1/$2');
    d = d.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
  }
  return d;
}
function maskTelefone(v){
  let d = onlyDigits(v).slice(0,11);
  if(!d) return '';
  d = d.replace(/^(\d{2})(\d)/, '($1) $2');
  if(onlyDigits(d).length>10){
    d = d.replace(/(\d{5})(\d{1,4})$/, '$1-$2');
  }else{
    d = d.replace(/(\d{4})(\d{1,4})$/, '$1-$2');
  }
  return d;
}
function maskCEP(v){
  let d = onlyDigits(v).slice(0,8);
  d = d.replace(/(\d{5})(\d{1,3})$/, '$1-$2');
  return d;
}
function bindMask(selector, maskFn){
  document.querySelectorAll(selector).forEach(el=>{
    if(el.dataset.maskBound) return;
    el.dataset.maskBound = '1';
    if(el.value) el.value = maskFn(el.value);
    el.addEventListener('input', ()=>{ el.value = maskFn(el.value); });
  });
}
function applyInputMasks(){
  bindMask('input[name="cpf"]', maskCPFCNPJ);
  bindMask('input[name="telefone"]', maskTelefone);
  bindMask('input[name="cep"]', maskCEP);
  bindCepLookup();
}

/* ---------- busca automática de endereço pelo CEP (ViaCEP) ---------- */
function bindCepLookup(){
  document.querySelectorAll('input[name="cep"]').forEach(el=>{
    if(el.dataset.cepLookupBound) return;
    el.dataset.cepLookupBound = '1';
    el.addEventListener('blur', ()=> tryLookupCep(el));
    el.addEventListener('input', ()=>{
      if(onlyDigits(el.value).length===8) tryLookupCep(el);
    });
  });
}
async function tryLookupCep(el){
  const digits = onlyDigits(el.value);
  if(digits.length!==8) return;
  const form = el.closest('form');
  if(!form) return;
  el.dataset.lastLookup = digits;
  try{
    const resp = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
    const data = await resp.json();
    if(el.dataset.lastLookup !== digits) return; // o campo já mudou desde a busca
    if(data.erro){ toast('CEP não encontrado.'); return; }
    const enderecoEl = form.querySelector('[name="endereco"]');
    const bairroEl = form.querySelector('[name="bairro"]');
    const cidadeEl = form.querySelector('[name="cidade"]');
    const ufEl = form.querySelector('[name="uf"]');
    if(enderecoEl && !enderecoEl.value.trim()) enderecoEl.value = data.logradouro || '';
    if(bairroEl && !bairroEl.value.trim()) bairroEl.value = data.bairro || '';
    if(cidadeEl && !cidadeEl.value.trim()) cidadeEl.value = data.localidade || '';
    if(ufEl && !ufEl.value.trim()) ufEl.value = data.uf || '';
    // número não vem no retorno do CEP: se o campo existir, o foco vai para lá
    // para o usuário completar rapidamente.
    const numeroEl = form.querySelector('[name="numero"]');
    if(numeroEl && !numeroEl.value.trim()) numeroEl.focus();
    toast('Endereço preenchido a partir do CEP.');
  }catch(e){
    console.error('Erro ao buscar CEP', e);
  }
}

  if(!pg) return '';
  return `pagos integralmente na assinatura do contrato, à vista, no valor de R$ ${fmtMoney(pg.vista)} (${valorExtenso(pg.vista)}).`;
}
